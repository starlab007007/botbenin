server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html : jamais en cache pour toujours charger la dernière version après déploiement
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Service worker et manifest : pas de cache (sw.js est un kill-switch)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Assets hashés (Vite) : cache long et immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Images / fonts à la racine
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_static on;
}
