name: Diagnose BotBJ production availability
on:
  push:
    branches: [diag/production-availability-20261023]
concurrency:
  group: diagnose-botbj-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read VPS resource and service health
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 30s
          command_timeout: 2m
          script: |
            date -u
            uptime
            free -m
            df -h / /tmp
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            docker stats --no-stream || true
            docker inspect --format "{{.Name}} running={{.State.Running}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}" react-app-botjs || true
            ps -eo pid,comm,pcpu,pmem --sort=-pcpu | head -n 12
            curl --connect-timeout 4 --max-time 8 -sS -o /dev/null -w "local_http=%{http_code}\n" http://127.0.0.1:8084/waouh-release.json || true
            curl --connect-timeout 4 --max-time 8 -sS -o /dev/null -w "public_https=%{http_code}\n" https://bot.bj/waouh-release.json || true
            journalctl -k --since "20 min ago" --no-pager 2>/dev/null | tail -n 30 || true
