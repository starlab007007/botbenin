name: Deploy React App botbj

on:
  push:
    branches:
      - prod
  pull_request:
    branches: [prod]
    paths: [Dockerfile, .dockerignore, .github/workflows/deploy.yml]
  workflow_dispatch:

concurrency:
  group: deploy-botbj-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code GitHub Actions
        uses: actions/checkout@v4

      - name: Verify WAOUH release alignment
        run: python3 scripts/verify-waouh-release.py

      - name: Vérifier les sources critiques avant déploiement
        run: |
          set -euo pipefail
          test -f public/fa/index.html
          test -f public/fa/home-premium-v23.css
          grep -q '20260724-corpus-v15-2' public/fa/index.html
          grep -q '20260724-home-v23-1' public/fa/index.html
          grep -q 'home-premium-v23.css' public/fa/index.html

          test -f public/apresbacia/index.html
          test -f public/apresbacia/styles-v2.css
          test -f public/apresbacia/theme-v2_16.css
          test -f public/apresbacia/production-finalization-v2_17.js
          grep -q '/apresbacia/styles-v2.css' public/apresbacia/index.html
          grep -q '/apresbacia/theme-v2_16.css' public/apresbacia/index.html
          grep -q '/apresbacia/production-finalization-v2_17.js' public/apresbacia/index.html

          test -f src/pages/PublicAgentWebChatPage.tsx
          test -f src/pages/NotFound.tsx
          grep -q 'PUBLIC_AGENT_API_BASE' src/pages/PublicAgentWebChatPage.tsx
          grep -q 'PUBLIC_AGENT_SLUG' src/pages/NotFound.tsx
          grep -q 'PublicAgentWebChatPage' src/pages/NotFound.tsx

          test -f public/waouh-ui-version.txt
          grep -q '^flutter=' public/waouh-ui-version.txt
          grep -q 'bot-avatar-v3' src/app-mobile/screens/ChatListScreen.tsx
          grep -q 'bot-home-v3' src/pages/waouh/WaouhAvatarHomePage.tsx
          grep -q 'data-expression' src/components/waouh/bot/BotCharacter.tsx
          grep -q 'bot-copilot-v2' src/components/waouh/WaouhMatchChatWindow.tsx

          echo "✅ Sources FA IA, AprèsBac IA, Web Chat public et UI WAOUH V2 prêtes"

      - name: Construire et vérifier l’image sur le runner CI
        run: |
          set -euo pipefail
          docker build --pull --label io.botbj.release=true --label org.opencontainers.image.revision="$GITHUB_SHA" -t "botbj-ci:$GITHUB_SHA" .
          docker run --rm --entrypoint nginx "botbj-ci:$GITHUB_SHA" -t
          docker save "botbj-ci:$GITHUB_SHA" | gzip -1 > botbj-image.tar.gz
          sha256sum botbj-image.tar.gz > botbj-image.tar.gz.sha256

      - name: Transférer l’image vérifiée vers le VPS
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "botbj-image.tar.gz,botbj-image.tar.gz.sha256"
          target: "/tmp/botbj-ci-${{ github.sha }}"
          command_timeout: 10m

      - name: Déployer sur le VPS avec Docker Compose
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v0.1.10
        env:
          DEPLOY_TOKEN: ${{ github.token }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_TOKEN,DEPLOY_REPOSITORY,DEPLOY_SHA
          script: |
            set -eu

            RELEASE_URL="https://api.github.com/repos/${DEPLOY_REPOSITORY}/tarball/${DEPLOY_SHA}"
            RELEASE_ARCHIVE="/tmp/botbenin-${DEPLOY_SHA}.tar.gz"
            RELEASE_DIR="/tmp/botbenin-release-${DEPLOY_SHA}"
            APP_DIR="/home/debian/botbenin"
            CI_IMAGE_DIR="/tmp/botbj-ci-${DEPLOY_SHA}"

            # Vérifier le transfert avant toute synchronisation de la livraison.
            (cd "$CI_IMAGE_DIR" && sha256sum -c botbj-image.tar.gz.sha256)

            echo "🧹 Nettoyage préventif de l’espace disque..."
            df -h / /tmp || true

            find /tmp -maxdepth 1 -type f -name 'botbenin-*.tar.gz' -delete 2>/dev/null || true
            find /tmp -maxdepth 1 -type d -name 'botbenin-release-*' -exec rm -rf {} + 2>/dev/null || true


            find /tmp -mindepth 1 -maxdepth 1 -type f -mtime +2 -delete 2>/dev/null || true
            journalctl --vacuum-time=7d >/dev/null 2>&1 || true

            AVAILABLE_KB=$(df -Pk /tmp | awk 'NR==2 {print $4}')
            MIN_REQUIRED_KB=524288
            if [ "${AVAILABLE_KB:-0}" -lt "$MIN_REQUIRED_KB" ]; then
              echo "❌ Espace disque insuffisant dans /tmp après nettoyage. Minimum requis : 512 Mo."
              df -h / /tmp || true
              docker system df || true
              exit 1
            fi

            echo "✅ Espace disponible après nettoyage : $((AVAILABLE_KB / 1024)) Mo"
            echo "📥 Téléchargement authentifié du commit ${DEPLOY_SHA}..."
            rm -rf "$RELEASE_DIR"
            rm -f "$RELEASE_ARCHIVE"
            mkdir -p "$RELEASE_DIR" "$APP_DIR"

            cleanup_release() {
              rm -rf "$RELEASE_DIR" 2>/dev/null || true
              rm -f "$RELEASE_ARCHIVE" 2>/dev/null || true
            }
            trap cleanup_release EXIT INT TERM

            DOWNLOAD_OK=0
            for ATTEMPT in 1 2 3; do
              echo "Tentative ${ATTEMPT}/3..."
              if curl \
                --fail \
                --location \
                --show-error \
                --silent \
                --retry 3 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 300 \
                -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$RELEASE_URL" \
                --output "$RELEASE_ARCHIVE"; then
                DOWNLOAD_OK=1
                break
              fi
              sleep 15
            done

            if [ "$DOWNLOAD_OK" -ne 1 ] || [ ! -s "$RELEASE_ARCHIVE" ]; then
              echo "❌ Téléchargement authentifié impossible"
              exit 1
            fi

            echo "🔎 Validation de l’archive..."
            tar -tzf "$RELEASE_ARCHIVE" >/dev/null
            tar -xzf "$RELEASE_ARCHIVE" --strip-components=1 -C "$RELEASE_DIR"

            test -f "$RELEASE_DIR/public/fa/index.html"
            test -f "$RELEASE_DIR/public/fa/home-premium-v23.css"
            test -f "$RELEASE_DIR/public/apresbacia/index.html"
            test -f "$RELEASE_DIR/public/apresbacia/styles-v2.css"
            test -f "$RELEASE_DIR/public/apresbacia/theme-v2_16.css"
            test -f "$RELEASE_DIR/public/apresbacia/production-finalization-v2_17.js"
            test -f "$RELEASE_DIR/src/pages/PublicAgentWebChatPage.tsx"
            test -f "$RELEASE_DIR/src/pages/NotFound.tsx"
            grep -q '20260724-corpus-v15-2' "$RELEASE_DIR/public/fa/index.html"
            grep -q '20260724-home-v23-1' "$RELEASE_DIR/public/fa/index.html"
            grep -q '/apresbacia/styles-v2.css' "$RELEASE_DIR/public/apresbacia/index.html"
            grep -q '/apresbacia/production-finalization-v2_17.js' "$RELEASE_DIR/public/apresbacia/index.html"
            grep -q 'PUBLIC_AGENT_SLUG' "$RELEASE_DIR/src/pages/NotFound.tsx"

            echo "📂 Synchronisation du code..."
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete "$RELEASE_DIR/" "$APP_DIR/"
            else
              rm -rf "$APP_DIR"/* "$APP_DIR"/.[!.]* "$APP_DIR"/..?* 2>/dev/null || true
              cp -a "$RELEASE_DIR"/. "$APP_DIR"/
            fi

            cd "$APP_DIR"
            cleanup_release
            trap - EXIT INT TERM

            echo "📦 Chargement de l’image construite et vérifiée en CI..."
            docker load -i "$CI_IMAGE_DIR/botbj-image.tar.gz"
            docker run --rm --entrypoint nginx "botbj-ci:${DEPLOY_SHA}" -t
            docker tag "botbj-ci:${DEPLOY_SHA}" botbenin-react-app:latest
            docker compose up -d --no-build --force-recreate --remove-orphans
            rm -f "$CI_IMAGE_DIR/botbj-image.tar.gz" "$CI_IMAGE_DIR/botbj-image.tar.gz.sha256"
            rmdir "$CI_IMAGE_DIR" || true

            echo "⏳ Attente du démarrage..."
            sleep 20
            docker compose ps

            READY=0
            for i in $(seq 1 15); do
              if curl --connect-timeout 5 --max-time 15 -fsSL http://127.0.0.1:8084/apresbacia >/dev/null 2>&1 && \
                 curl --connect-timeout 5 --max-time 15 -fsSL http://127.0.0.1:8084/apresbacia/styles-v2.css >/dev/null 2>&1 && \
                 curl --connect-timeout 5 --max-time 15 -fsSL http://127.0.0.1:8084/apresbacia/production-finalization-v2_17.js >/dev/null 2>&1 && \
                 curl --connect-timeout 5 --max-time 15 -fsSL http://127.0.0.1:8084/fa >/dev/null 2>&1 && \
                 curl --connect-timeout 5 --max-time 15 -fsSL http://127.0.0.1:8084/ecqdg4yzr >/dev/null 2>&1; then
                READY=1
                break
              fi
              echo "⏳ Santé locale $i/15..."
              sleep 4
            done
            [ "$READY" -eq 1 ] || { docker compose logs --tail=150; exit 1; }

            echo "🧪 Vérification des fichiers dans le conteneur..."
            docker compose exec -T react-app test -f /usr/share/nginx/html/apresbacia/index.html
            docker compose exec -T react-app test -f /usr/share/nginx/html/apresbacia/styles-v2.css
            docker compose exec -T react-app test -f /usr/share/nginx/html/apresbacia/theme-v2_16.css
            docker compose exec -T react-app test -f /usr/share/nginx/html/apresbacia/production-finalization-v2_17.js
            docker compose exec -T react-app grep -q '/apresbacia/styles-v2.css' /usr/share/nginx/html/apresbacia/index.html
            docker compose exec -T react-app grep -q '/apresbacia/production-finalization-v2_17.js' /usr/share/nginx/html/apresbacia/index.html
            docker compose exec -T react-app test -f /usr/share/nginx/html/fa/index.html
            docker compose exec -T react-app test -f /usr/share/nginx/html/fa/home-premium-v23.css
            docker compose exec -T react-app grep -q '20260724-home-v23-1' /usr/share/nginx/html/fa/index.html
            docker compose exec -T react-app sh -c "grep -R -q 'Le Web Chat est momentanément indisponible' /usr/share/nginx/html/assets/js"
            docker compose exec -T react-app test -f /usr/share/nginx/html/waouh-ui-version.txt
            docker compose exec -T react-app grep -Fxq "$(head -n 1 public/waouh-ui-version.txt)" /usr/share/nginx/html/waouh-ui-version.txt
            docker compose exec -T react-app sh -c "grep -R -q 'bot-avatar-v3' /usr/share/nginx/html/assets/js"
            docker compose exec -T react-app sh -c "grep -R -q 'bot-copilot-v2' /usr/share/nginx/html/assets/js"

            PUBLIC_AGENT_CHUNK=$(docker compose exec -T react-app sh -c "ls /usr/share/nginx/html/assets/js/PublicAgentWebChatPage-*.js /usr/share/nginx/html/assets/js/PublicBotChatPage-*.js 2>/dev/null | head -n1" | tr -d '\r')
            if [ -z "$PUBLIC_AGENT_CHUNK" ]; then
              echo "ℹ️ Aucun chunk public nommé PublicAgentWebChatPage/PublicBotChatPage trouvé — contrôle par contenu global déjà validé."
            else
              echo "✅ Chunk Web Chat public détecté : $(basename "$PUBLIC_AGENT_CHUNK")"
            fi

            PUBLIC_READY=0
            for i in $(seq 1 15); do
              if curl --connect-timeout 5 --max-time 15 -fsSL https://bot.bj/apresbacia >/dev/null 2>&1 && \
                 curl --connect-timeout 5 --max-time 15 -fsSL https://bot.bj/apresbacia/styles-v2.css | grep -q -- '--green' && \
                 curl --connect-timeout 5 --max-time 15 -fsSL https://bot.bj/apresbacia/theme-v2_16.css | grep -q -- '--ab-blue' && \
                 curl --connect-timeout 5 --max-time 15 -fsSL https://bot.bj/apresbacia/production-finalization-v2_17.js >/dev/null 2>&1 && \
                 curl --connect-timeout 5 --max-time 15 -fsSL https://bot.bj/fa >/dev/null 2>&1 && \
                 curl --connect-timeout 5 --max-time 15 -fsSL -H 'Cache-Control: no-cache' "https://bot.bj/fa/app.js?deploy_check=${DEPLOY_SHA}" >/dev/null 2>&1 && \
                 curl --connect-timeout 5 --max-time 15 -fsSL -H 'Cache-Control: no-cache' "https://bot.bj/app/chat?deploy_check=${DEPLOY_SHA}" >/dev/null 2>&1 && \
                 curl --connect-timeout 5 --max-time 15 -fsSL -H 'Cache-Control: no-cache' "https://bot.bj/waouh-ui-version.txt?deploy_check=${DEPLOY_SHA}" | grep -Fxq "$(head -n 1 public/waouh-ui-version.txt)" && \
                 curl --connect-timeout 5 --max-time 15 -fsSL -H 'Cache-Control: no-cache' "https://bot.bj/ecqdg4yzr?deploy_check=${DEPLOY_SHA}" >/dev/null 2>&1; then
                PUBLIC_READY=1
                break
              fi
              echo "⏳ Santé publique $i/15..."
              sleep 4
            done
            [ "$PUBLIC_READY" -eq 1 ] || { echo "❌ Assets publics AprèsBac IA/Web Chat non publiés"; exit 1; }

            echo "🧪 Vérification publique de la version V23.1..."
            PUBLIC_FA_HTML=$(curl --connect-timeout 5 --max-time 15 -fsSL --retry 3 --retry-all-errors 'https://bot.bj/fa?deploy_check=20260724-home-v23-1')
            echo "$PUBLIC_FA_HTML" | grep -q '20260724-home-v23-1'

            echo "🧪 Vérification publique de la feuille premium..."
            curl --connect-timeout 5 --max-time 15 -fsSL --retry 3 --retry-all-errors \
              'https://bot.bj/fa/home-premium-v23.css?v=20260724-home-v23-1' \
              | grep -q 'FA IA V23.1'

            echo "🔐 Vérification des en-têtes de sécurité..."
            SECURITY_HEADERS=$(curl --connect-timeout 5 --max-time 15 -sSIL https://bot.bj/apresbacia | tr -d '\r')
            echo "$SECURITY_HEADERS" | grep -qi '^strict-transport-security:'
            echo "$SECURITY_HEADERS" | grep -qi '^x-content-type-options: nosniff$'
            echo "$SECURITY_HEADERS" | grep -qi '^content-security-policy:'
            echo "$SECURITY_HEADERS" | grep -qi '^permissions-policy:'

            docker compose exec -T react-app sh -c "! grep -R 'G-XXXXXXXXXX' /usr/share/nginx/html/assets/js /usr/share/nginx/html/index.html"

            docker compose exec -T react-app sh -c '
              REACT_FILE=$(ls /usr/share/nginx/html/assets/js/react-*.js 2>/dev/null | head -n1)
              if [ -n "$REACT_FILE" ] && grep -q "charts-" "$REACT_FILE"; then
                exit 1
              fi
            '

            # Garder sept jours d’images de cette application pour le retour arrière.
            docker image prune -af --filter label=io.botbj.release=true --filter until=168h || true
            echo "✅ Déploiement production, AprèsBac IA et Web Chat public terminés"
