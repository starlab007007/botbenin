
name: Deploy React App botbj

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS avec Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Arrête le script en cas d'erreur

            cd /home/debian/botbenin/

            echo "📥 Mise à jour du code..."
            git pull origin main

            echo "🛑 Arrêt des anciens conteneurs..."
            docker compose down

            echo "🧹 Nettoyage des caches Docker..."
            docker system prune -f
            docker volume prune -f

            echo "🔨 Construction et redémarrage des services..."
            docker compose build --no-cache
            docker compose up -d --force-recreate

            echo "🔍 Vérification du statut des conteneurs..."
            docker compose ps

            echo "📋 Logs des conteneurs..."
            docker compose logs --tail=50

            echo "🧹 Nettoyage des anciennes images inutilisées..."
            docker image prune -af

            echo "✅ Déploiement terminé avec succès!"
