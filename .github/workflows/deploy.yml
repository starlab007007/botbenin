name: Deploy React App botbj

on:
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-botbj-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code GitHub Actions
        uses: actions/checkout@v4

      - name: Vérifier les fichiers FA IA avant déploiement
        run: |
          set -euo pipefail
          test -f public/fa/index.html
          test -f public/fa/home-premium-v23.css
          grep -q '20260724-corpus-v15-2' public/fa/index.html
          grep -q 'home-premium-v23.css' public/fa/index.html
          echo "✅ Sources FA IA prêtes pour le déploiement"

      - name: Déployer sur le VPS avec Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e

            COMMIT_SHA='${{ github.sha }}'
            RELEASE_URL="https://github.com/starlab007007/botbenin/archive/${COMMIT_SHA}.tar.gz"
            RELEASE_ARCHIVE="/tmp/botbenin-${COMMIT_SHA}.tar.gz"
            RELEASE_DIR="/tmp/botbenin-release-${COMMIT_SHA}"
            APP_DIR="/home/debian/botbenin"

            echo "📥 Téléchargement direct du commit ${COMMIT_SHA} depuis GitHub..."
            rm -rf "$RELEASE_DIR"
            rm -f "$RELEASE_ARCHIVE"
            mkdir -p "$RELEASE_DIR" "$APP_DIR"

            DOWNLOAD_OK=0
            for ATTEMPT in 1 2 3; do
              echo "Tentative de téléchargement ${ATTEMPT}/3..."
              if curl \
                --fail \
                --location \
                --show-error \
                --silent \
                --retry 3 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 300 \
                "$RELEASE_URL" \
                --output "$RELEASE_ARCHIVE"; then
                DOWNLOAD_OK=1
                break
              fi
              sleep 15
            done

            if [ "$DOWNLOAD_OK" -ne 1 ] || [ ! -s "$RELEASE_ARCHIVE" ]; then
              echo "❌ Impossible de télécharger l’archive du commit GitHub"
              exit 1
            fi

            echo "🔎 Validation de l’archive..."
            tar -tzf "$RELEASE_ARCHIVE" >/dev/null
            tar -xzf "$RELEASE_ARCHIVE" --strip-components=1 -C "$RELEASE_DIR"

            test -f "$RELEASE_DIR/public/fa/index.html"
            test -f "$RELEASE_DIR/public/fa/home-premium-v23.css"
            grep -q '20260724-corpus-v15-2' "$RELEASE_DIR/public/fa/index.html"
            grep -q 'home-premium-v23.css' "$RELEASE_DIR/public/fa/index.html"

            echo "📂 Synchronisation du code sur le VPS..."
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete "$RELEASE_DIR/" "$APP_DIR/"
            else
              rm -rf "$APP_DIR"/* "$APP_DIR"/.[!.]* "$APP_DIR"/..?* 2>/dev/null || true
              cp -a "$RELEASE_DIR"/. "$APP_DIR"/
            fi

            cd "$APP_DIR"
            rm -rf "$RELEASE_DIR"
            rm -f "$RELEASE_ARCHIVE"
            echo "✅ Commit synchronisé directement depuis GitHub"

            echo "🔨 Construction de la nouvelle image pendant que l’ancienne reste active..."
            docker compose build --pull || {
              echo "❌ Erreur lors du build"
              exit 1
            }

            echo "🚀 Remplacement contrôlé du service..."
            docker compose up -d --force-recreate --remove-orphans || {
              echo "❌ Erreur lors du démarrage"
              exit 1
            }

            echo "⏳ Attente du démarrage complet..."
            sleep 20

            echo "🔍 Vérification du statut des conteneurs..."
            docker compose ps

            echo "🧪 Test de santé local AprèsBac IA..."
            READY=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8084/apresbacia >/dev/null 2>&1; then
                READY=1
                echo "✅ AprèsBac IA accessible localement"
                break
              fi
              echo "⏳ Tentative locale $i/15..."
              sleep 4
            done

            if [ "$READY" -ne 1 ]; then
              echo "❌ AprèsBac IA n'est pas accessible localement"
              docker compose logs --tail=150
              exit 1
            fi

            echo "🧪 Test de santé local FA IA..."
            FA_READY=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8084/fa >/dev/null 2>&1; then
                FA_READY=1
                echo "✅ FA IA accessible localement"
                break
              fi
              echo "⏳ Tentative FA IA $i/15..."
              sleep 4
            done

            if [ "$FA_READY" -ne 1 ]; then
              echo "❌ FA IA n'est pas accessible localement"
              docker compose logs --tail=150
              exit 1
            fi

            echo "🧪 Vérification de la redirection vers l'URL courte..."
            curl -sSI 'http://127.0.0.1:8084/apresbacia?v=controle' \
              | tr -d '\r' \
              | grep -qi '^location: https://bot.bj/apresbacia$' || {
              echo "❌ L'URL avec paramètres n'est pas redirigée vers l'URL canonique"
              exit 1
            }

            echo "🧪 Vérification des fichiers de production..."
            docker compose exec -T react-app test -f /usr/share/nginx/html/apresbacia/index.html
            docker compose exec -T react-app test -f /usr/share/nginx/html/apresbacia/production-finalization-v2_17.js
            docker compose exec -T react-app test -f /usr/share/nginx/html/fa/index.html
            docker compose exec -T react-app test -f /usr/share/nginx/html/fa/home-premium-v23.css
            docker compose exec -T react-app grep -q 'home-premium-v23.css' /usr/share/nginx/html/fa/index.html

            echo "🧪 Vérification publique HTTPS..."
            PUBLIC_READY=0
            for i in $(seq 1 15); do
              if curl -fsS https://bot.bj/apresbacia >/dev/null 2>&1 && curl -fsS https://bot.bj/fa >/dev/null 2>&1; then
                PUBLIC_READY=1
                echo "✅ URLs publiques accessibles"
                break
              fi
              echo "⏳ Tentative publique $i/15..."
              sleep 4
            done

            if [ "$PUBLIC_READY" -ne 1 ]; then
              echo "❌ Une URL publique est inaccessible"
              exit 1
            fi

            echo "🔐 Vérification des en-têtes de sécurité..."
            SECURITY_HEADERS=$(curl -sSI https://bot.bj/apresbacia | tr -d '\r')
            echo "$SECURITY_HEADERS" | grep -qi '^strict-transport-security:'
            echo "$SECURITY_HEADERS" | grep -qi '^x-content-type-options: nosniff$'
            echo "$SECURITY_HEADERS" | grep -qi '^content-security-policy:'
            echo "$SECURITY_HEADERS" | grep -qi '^permissions-policy:'

            echo "📋 Logs des conteneurs (dernières 100 lignes)..."
            docker compose logs --tail=100

            echo "🧪 Vérification anti-ancien bundle..."
            docker compose exec -T react-app sh -c "! grep -R 'G-XXXXXXXXXX' /usr/share/nginx/html/assets/js /usr/share/nginx/html/index.html" || {
              echo "❌ Ancien bundle Google Analytics encore présent"
              exit 1
            }

            echo "🧪 Vérification anti-cycle de chunks (react <-> charts)..."
            docker compose exec -T react-app sh -c '
              REACT_FILE=$(ls /usr/share/nginx/html/assets/js/react-*.js 2>/dev/null | head -n1)
              if [ -n "$REACT_FILE" ] && grep -q "charts-" "$REACT_FILE"; then
                echo "❌ Cycle détecté: $REACT_FILE importe un chunk charts-*.js"
                exit 1
              fi
              echo "✅ Pas de cycle react<->charts"
            ' || {
              echo "❌ Cycle de chunks détecté"
              exit 1
            }

            echo "🧹 Nettoyage final des images inutilisées..."
            docker image prune -af || echo "⚠️ Nettoyage final partiel"

            echo "✅ Déploiement terminé avec succès"
            echo "🌐 URL FA IA : https://bot.bj/fa"
            echo "🌐 URL AprèsBac IA : https://bot.bj/apresbacia"
