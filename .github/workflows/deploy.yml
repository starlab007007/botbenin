
name: Deploy React App botbj

on:
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code GitHub Actions
        uses: actions/checkout@v4

      - name: Préparer l'archive de déploiement
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='*.log' \
            --exclude='*.tgz' \
            -czf /tmp/botbenin-release.tgz .
          mv /tmp/botbenin-release.tgz ./botbenin-release.tgz

      - name: Envoyer le code sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: botbenin-release.tgz
          target: /tmp

      - name: Déployer sur le VPS avec Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e  # Arrête le script en cas d'erreur

            echo "📥 Mise à jour du code depuis l'archive GitHub Actions..."
            if [ ! -f /tmp/botbenin-release.tgz ]; then
              echo "❌ Archive de déploiement introuvable sur le VPS";
              exit 1;
            fi
            rm -rf /tmp/botbenin-release
            mkdir -p /tmp/botbenin-release /home/debian/botbenin
            tar -xzf /tmp/botbenin-release.tgz -C /tmp/botbenin-release
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete /tmp/botbenin-release/ /home/debian/botbenin/
            else
              rm -rf /home/debian/botbenin/* /home/debian/botbenin/.[!.]* /home/debian/botbenin/..?* 2>/dev/null || true
              cp -a /tmp/botbenin-release/. /home/debian/botbenin/
            fi
            cd /home/debian/botbenin/
            rm -rf /tmp/botbenin-release
            rm -f /tmp/botbenin-release.tgz
            echo "✅ Code synchronisé sans accès GitHub SSH côté VPS"

            echo "🛑 Arrêt des anciens conteneurs..."
            docker compose down || echo "⚠️ Aucun conteneur à arrêter"

            echo "🧹 Nettoyage complet..."
            docker system prune -af --volumes || echo "⚠️ Nettoyage partiel"
            docker builder prune -af || echo "⚠️ Nettoyage builder partiel"

            echo "🔨 Construction des images..."
            docker compose build --no-cache --pull || { echo "❌ Erreur lors du build"; exit 1; }

            echo "🚀 Démarrage des services..."
            docker compose up -d --force-recreate || { echo "❌ Erreur lors du démarrage"; exit 1; }

            echo "⏳ Attente du démarrage complet..."
            sleep 30

            echo "🔍 Vérification du statut des conteneurs..."
            docker compose ps

            echo "🧪 Test de santé du service..."
            for i in {1..10}; do
              if curl -f http://localhost:8084 > /dev/null 2>&1; then
                echo "✅ Service accessible"
                break
              fi
              echo "⏳ Tentative $i/10..."
              sleep 5
            done

            echo "📋 Logs des conteneurs (dernières 100 lignes)..."
            docker compose logs --tail=100

            echo "🔍 Vérification des fichiers dans le conteneur..."
            docker compose exec -T react-app ls -la /usr/share/nginx/html/ || echo "⚠️ Impossible de lister les fichiers"

            echo "🧪 Vérification anti-ancien bundle..."
            docker compose exec -T react-app sh -c "! grep -R 'G-XXXXXXXXXX' /usr/share/nginx/html/assets/js /usr/share/nginx/html/index.html" || { echo "❌ Ancien bundle Google Analytics encore présent"; exit 1; }

            echo "🧪 Vérification anti-cycle de chunks (react <-> charts)..."
            docker compose exec -T react-app sh -c '
              REACT_FILE=$(ls /usr/share/nginx/html/assets/js/react-*.js 2>/dev/null | head -n1);
              if [ -n "$REACT_FILE" ] && grep -q "charts-" "$REACT_FILE"; then
                echo "❌ Cycle détecté: $REACT_FILE importe un chunk charts-*.js";
                exit 1;
              fi;
              echo "✅ Pas de cycle react<->charts"
            ' || { echo "❌ Cycle de chunks détecté"; exit 1; }

            echo "🧹 Nettoyage final des images inutilisées..."
            docker image prune -af || echo "⚠️ Nettoyage final partiel"

            echo "✅ Déploiement terminé avec succès!"
            echo "🌐 Application accessible sur: http://bot.bj"
