
name: Deploy React App botbj

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS avec Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Arrête le script en cas d'erreur

            cd /home/debian/botbenin/

            echo "📥 Mise à jour du code..."
            git fetch origin prod || { echo "❌ Erreur lors du git fetch"; exit 1; }
            git reset --hard origin/prod || { echo "❌ Erreur lors de la synchronisation avec main"; exit 1; }

            echo "🛑 Arrêt des anciens conteneurs..."
            docker compose down || echo "⚠️ Aucun conteneur à arrêter"

            echo "🧹 Nettoyage complet..."
            docker system prune -af --volumes || echo "⚠️ Nettoyage partiel"
            docker builder prune -af || echo "⚠️ Nettoyage builder partiel"

            echo "🔨 Construction des images..."
            docker compose build --no-cache --pull || { echo "❌ Erreur lors du build"; exit 1; }

            echo "🚀 Démarrage des services..."
            docker compose up -d --force-recreate || { echo "❌ Erreur lors du démarrage"; exit 1; }

            echo "⏳ Attente du démarrage complet..."
            sleep 30

            echo "🔍 Vérification du statut des conteneurs..."
            docker compose ps

            echo "🧪 Test de santé du service..."
            for i in {1..10}; do
              if curl -f http://localhost:8084 > /dev/null 2>&1; then
                echo "✅ Service accessible"
                break
              fi
              echo "⏳ Tentative $i/10..."
              sleep 5
            done

            echo "📋 Logs des conteneurs (dernières 100 lignes)..."
            docker compose logs --tail=100

            echo "🔍 Vérification des fichiers dans le conteneur..."
            docker compose exec -T react-app ls -la /usr/share/nginx/html/ || echo "⚠️ Impossible de lister les fichiers"

            echo "🧪 Vérification anti-ancien bundle..."
            docker compose exec -T react-app sh -c "! grep -R 'G-XXXXXXXXXX' /usr/share/nginx/html/assets/js /usr/share/nginx/html/index.html" || { echo "❌ Ancien bundle Google Analytics encore présent"; exit 1; }

            echo "🧹 Nettoyage final des images inutilisées..."
            docker image prune -af || echo "⚠️ Nettoyage final partiel"

            echo "✅ Déploiement terminé avec succès!"
            echo "🌐 Application accessible sur: http://bot.bj"
