name: WAOUH Android emulator test

# Installe l'APK publié (bot.bj/android) sur un émulateur Android et parcourt
# l'application : lancement, connexion, recherche, résultats, onglets principaux.
# Captures, journaux et rapport sont joints à l'exécution.
on:
  push:
    branches: [prod]
    paths:
      - '.github/workflows/waouh-android-emulator-test.yml'
      - 'scripts/android-emulator-*.py'
      - 'scripts/android-emulator-*.sh'
      - 'scripts/tests/test_android_emulator_smoke.py'
  pull_request:
    branches: [prod]
    paths:
      - '.github/workflows/waouh-android-emulator-test.yml'
      - 'scripts/android-emulator-smoke.py'
      - 'scripts/android-emulator-*.sh'
      - 'scripts/tests/test_android_emulator_smoke.py'
  workflow_dispatch:
    inputs:
      api_level:
        description: "Version Android de l'émulateur (API)"
        default: "35"
      capture_video:
        description: "Enregistrer également une vidéo"
        type: boolean
        default: false
  workflow_run:
    workflows: ["WAOUH Flutter Muse NEXUS CI"]
    types: [completed]
    branches: [prod]

concurrency:
  # PR driver checks must never cancel a real production emulator recipe.
  group: waouh-android-emulator-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  driver-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/android-emulator-run.sh
      - run: python3 -m py_compile scripts/android-emulator-smoke.py scripts/android_notification_recovery.py
      - run: python3 -m unittest discover -s scripts/tests -p test_android_emulator_smoke.py

  emulator:
    needs: driver-tests
    # A deliberate QA-only production push must also exercise the published APK.
    if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      OUT_DIR: ${{ github.workspace }}/emulator-out
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare host virtualization and native emulator libraries
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          # A fresh hosted runner may still be processing the udev event.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          for i in $(seq 1 10); do
            if [ -c /dev/kvm ]; then
              sudo chmod a+rw /dev/kvm
              break
            fi
            sleep 2
          done
          {
            uname -a
            id
            ls -l /dev/kvm || true
            grep -m1 -oE 'vmx|svm' /proc/cpuinfo || true
          } > "$OUT_DIR/kvm-host.txt"
          cat "$OUT_DIR/kvm-host.txt"
          if [ ! -c /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::Hosted runner has no accessible KVM device"
            exit 1
          fi
          # libpulse.so.0 was missing in a prior production recipe.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          ldconfig -p | grep 'libpulse.so.0' > "$OUT_DIR/native-libraries.txt"
          cat "$OUT_DIR/native-libraries.txt"

      - name: Download published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            gh release download waouh-android-latest -R "$GITHUB_REPOSITORY" -p waouh-android.apk -p waouh-android.json -D apk --clobber && break
            echo "Nouvel essai de téléchargement ($i)"; sleep $((i * 10))
          done
          test -s apk/waouh-android.apk
          cat apk/waouh-android.json
          sha256sum apk/waouh-android.apk

      # L'APK publié ne contient que le code des téléphones (ARM). L'émulateur des
      # serveurs GitHub est en x86_64 : on recompile exactement la même version
      # (même commit, même cible, même numéro de build) pour ce processeur.
      - name: Same version for the emulator CPU
        run: |
          set -euo pipefail
          COMMIT="$(python3 -c "import json;print(json.load(open('apk/waouh-android.json'))['commit'])")"
          echo "Version publiée construite depuis $COMMIT"
          git checkout "$COMMIT" -- flutter_waouh_app
          echo "APK_COMMIT=$COMMIT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build x86_64 APK (test only)
        working-directory: flutter_waouh_app
        env:
          WAOUH_TEST_RELEASE: "1"
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" >/dev/null
          flutter pub get
          BUILD_NUMBER="$(sed -n 's/^version: [0-9.]*+\([0-9]*\)$/\1/p' pubspec.yaml)"
          flutter build apk --release --build-number="$BUILD_NUMBER" --target lib/live/live_app_production.dart --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk ../apk/waouh-android-x64.apk
          ls -la ../apk

      - name: Create disposable test account
        id: account
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'mvynepqulhflxtyymtzs' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, secrets, urllib.request
          ref = os.environ["SUPABASE_PROJECT_REF"]
          req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/api-keys",
              headers={"Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"]})
          service = next(k["api_key"] for k in json.load(urllib.request.urlopen(req, timeout=60)) if k["name"] == "service_role")
          print("::add-mask::" + service)
          email = f"android-ci-{os.environ['GITHUB_RUN_ID']}@waouh.test"
          password = "Ci-" + secrets.token_urlsafe(18).replace("-", "x").replace("_", "y")
          print("::add-mask::" + password)
          body = json.dumps({"email": email, "password": password, "email_confirm": True,
                             "app_metadata": {"waouh_validation": True},
                             "user_metadata": {"full_name": "Test Android CI"}}).encode()
          req = urllib.request.Request(f"https://{ref}.supabase.co/auth/v1/admin/users", data=body, method="POST",
              headers={"Authorization": "Bearer " + service, "apikey": service, "Content-Type": "application/json"})
          user = json.load(urllib.request.urlopen(req, timeout=60))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"email={email}\npassword={password}\nuser_id={user['id']}\n")
          prefs=json.dumps({"auth_user_id": user['id'], "autonomy_settings": {
              "paused": True, "mode": "assisted", "allow_contact": False,
              "allow_negotiate": False, "allow_whatsapp": False}}).encode()
          req=urllib.request.Request(f"https://{ref}.supabase.co/rest/v1/waouh_avatar_prefs?on_conflict=auth_user_id",
              data=prefs,method="POST",headers={"Authorization":"Bearer "+service,"apikey":service,
                  "Content-Type":"application/json","Prefer":"resolution=merge-duplicates"})
          urllib.request.urlopen(req,timeout=60).close()
          print("Compte de test créé, autonomie suspendue :", email)
          PY

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_EMAIL: ${{ steps.account.outputs.email }}
          TEST_PASSWORD: ${{ steps.account.outputs.password }}
          TEST_USER_ID: ${{ steps.account.outputs.user_id }}
          QA_RECOVERY: '1'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: mvynepqulhflxtyymtzs
          CAPTURE_SCREEN_VIDEO: ${{ inputs.capture_video && '1' || '0' }}
        with:
          api-level: ${{ github.event.inputs.api_level || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-emulator-run.sh apk/waouh-android-x64.apk

      - name: Summary
        if: always()
        run: test -f "$OUT_DIR/summary.md" && cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Collect emulator resource diagnostics
        if: failure()
        run: |
          free -h
          df -h
          sudo dmesg --level=emerg,alert,crit,err | tail -30 || true

      - name: Upload screenshots, video and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waouh-android-emulator
          path: emulator-out
          retention-days: 14

      - name: Publish results (release waouh-android-emulator-latest)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -d emulator-out || exit 0
          (cd emulator-out && zip -qr ../waouh-android-emulator.zip .)
          TAG=waouh-android-emulator-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "WAOUH Android — test émulateur" --notes "Dernier test sur émulateur" --latest=false --prerelease
          gh release edit "$TAG" --notes "Test émulateur — exécution ${GITHUB_RUN_ID}, commit ${GITHUB_SHA::8}" --latest=false
          gh release upload "$TAG" waouh-android-emulator.zip --clobber

      - name: Clean private recovery fixture
        if: always() && steps.account.outputs.user_id != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: mvynepqulhflxtyymtzs
          TEST_USER_ID: ${{ steps.account.outputs.user_id }}
          TEST_EMAIL: ${{ steps.account.outputs.email }}
        run: python3 scripts/android_notification_recovery.py

      - name: Delete test account
        if: always() && steps.account.outputs.user_id != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'mvynepqulhflxtyymtzs' }}
          TEST_USER_ID: ${{ steps.account.outputs.user_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          ref = os.environ["SUPABASE_PROJECT_REF"]
          req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/api-keys",
              headers={"Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"]})
          service = next(k["api_key"] for k in json.load(urllib.request.urlopen(req, timeout=60)) if k["name"] == "service_role")
          print("::add-mask::" + service)
          req = urllib.request.Request(f"https://{ref}.supabase.co/auth/v1/admin/users/{os.environ['TEST_USER_ID']}", method="DELETE",
              headers={"Authorization": "Bearer " + service, "apikey": service})
          try:
              urllib.request.urlopen(req, timeout=60); print("Compte de test supprimé")
          except Exception as e:
              print("::warning::Suppression du compte de test à refaire :", type(e).__name__)
          PY
