name: WAOUH Convergence contracts
on:
  pull_request:
    branches: [prod]
    paths: ['src/**', 'supabase/functions/_shared/**', 'supabase/functions/waouh-convergence/**', 'supabase/migrations/*waouh_convergence*', 'scripts/tests/waouh-convergence-db.mjs', 'tests/fixtures/**', 'package*.json', '.github/workflows/waouh-convergence-ci.yml']
  push:
    branches: [prod]
    paths: ['src/**', 'supabase/functions/_shared/**', 'supabase/functions/waouh-convergence/**', 'supabase/migrations/*waouh_convergence*', 'scripts/tests/waouh-convergence-db.mjs', 'tests/fixtures/**', 'package*.json', '.github/workflows/waouh-convergence-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: convergence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Compatible Vite 5 test runner
        run: npm install --no-save --package-lock=false --legacy-peer-deps vite@5.4.21 vitest@2.1.9
      - run: python3 scripts/verify-waouh-release.py
      - run: node scripts/tests/waouh-convergence-db.mjs
      - run: npx vitest run src/components/waouh/__tests__ src/lib/waouh/__tests__
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/waouh-convergence/deno.json supabase/functions/waouh-convergence/index.ts

  deploy-edge:
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Deploy the authenticated Convergence function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy waouh-convergence --project-ref mvynepqulhflxtyymtzs --use-api --no-verify-jwt
