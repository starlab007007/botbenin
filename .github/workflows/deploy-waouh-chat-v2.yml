name: Deploy WAOUH Chat v2
# Deployment sync: Avatar 18.30 2026-10-08; queued after Native production deployment.

on:
  push:
    branches:
      - prod
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/20260927120000_waouh_chat_messages_thread_base.sql"
      - "supabase/migrations/20260927120500_waouh_chat_messages_thread_backfill.sql"
      - "supabase/migrations/20260927121000_waouh_chat_reconcile.sql"
      - "supabase/migrations/20260928092242_waouh_chat_v3_flags.sql"
      - "supabase/migrations/20260928092245_waouh_commerce_actions.sql"
      - "supabase/migrations/20260929140000_waouh_presence_pin_attempts.sql"
      - "supabase/migrations/20260929150000_waouh_nexus_followup_cron.sql"
      - "supabase/migrations/20260929160000_waouh_avatar_prefs.sql"
      - "supabase/migrations/20261004223000_waouh_opportunity_os.sql"
      - "supabase/migrations/20261004224000_waouh_opportunity_worker_cron.sql"
      - "supabase/functions/_shared/waouh-chat-writer.ts"
      - "supabase/functions/_shared/waouh-commands.ts"
      - "supabase/functions/_shared/waouh-commerce-states.ts"
      - "supabase/functions/_shared/waouh-negotiation-intent.ts"
      - "supabase/functions/_shared/waouh-sync.ts"
      - "supabase/functions/_shared/waouh-deal-open.ts"
      - "supabase/functions/_shared/waouh-unified-quality.ts"
      - "supabase/functions/_shared/waouh-dedupe.ts"
      - "supabase/functions/_shared/waouh-interest-fastpath.ts"
      - "supabase/functions/_shared/waouh-message-catalog.ts"
      - "supabase/functions/_shared/waouh-commerce-contract.ts"
      - "supabase/functions/_shared/waouh-free-text.ts"
      - "supabase/functions/_shared/waouh-predictive.ts"
      - "supabase/functions/_shared/waouh-promote.ts"
      - "supabase/functions/_shared/waouh-phone.ts"
      - "supabase/functions/_shared/waouh-evict.ts"
      - "supabase/functions/_shared/waouh-nexus-deal.ts"
      - "supabase/functions/_shared/waouh-internal-auth.ts"
      - "supabase/functions/_shared/waouh-fanout.ts"
      - "supabase/functions/_shared/waouh-legacy-handler.ts"
      - "supabase/functions/_shared/waouh-egress-guard.ts"
      - "supabase/functions/_shared/waouh-pin-throttle.ts"
      - "supabase/functions/_shared/waouh-contact-path.ts"
      - "supabase/functions/_shared/waouh-avatar-notes.ts"
      - "supabase/functions/_shared/waouh-nexus-followup-core.ts"
      - "supabase/functions/_shared/waouh-opportunity-os.ts"
      - "supabase/functions/_shared/waouh-channel-router.ts"
      - "supabase/functions/_shared/waouh-runtime-auth.ts"
      - "supabase/functions/_shared/agent-ai.ts"
      - "supabase/functions/_shared/waouh-price.ts"
      - "supabase/functions/_shared/waouh-admin-contact-hub.ts"
      - "supabase/functions/waouh-admin-stats/**"
      - "supabase/functions/waouh-waha-sync-contacts/**"
      - "supabase/functions/waouh-notify-buyers/**"
      - "supabase/functions/waouh-geocode/**"
      - "supabase/functions/waouh-radar-apify/**"
      - "supabase/functions/waouh-radar-site-scraper/**"
      - "supabase/functions/waouh-radar-process/**"
      - "supabase/functions/waouh-serpapi-scout/**"
      - "supabase/functions/waouh-radar-campaign-tick/**"
      - "supabase/functions/waouh-alerts-check/**"
      - "supabase/functions/waouh-price-compare/**"
      - "supabase/functions/waouh-radar-wa-webhook/**"
      - "supabase/functions/waouh-stock-analyze/**"
      - "supabase/functions/waouh-bi-query/**"
      - "supabase/functions/waouh-agent-insights/**"
      - "supabase/functions/waouh-e2e-test/**"
      - "supabase/functions/waouh-opportunity-worker/**"
      - "supabase/functions/waouh-agentic-core/**"
      - "supabase/functions/waouh-outbound-dispatch/**"
      - "supabase/functions/waouh-nexus-followup/**"
      - "supabase/functions/_shared/waouh-avatar-briefing.ts"
      - "supabase/functions/_shared/waouh-avatar-briefing-core.ts"
      - "supabase/functions/waouh-avatar-briefing/**"
      - "supabase/functions/waouh-status-publish/**"
      - "supabase/functions/waouh-sell-handler/**"
      - "supabase/functions/waouh-negotiate-handler/**"
      - "supabase/functions/waouh-presence-public-page/**"
      - "supabase/functions/waouh-stock-ingest/**"
      - "supabase/functions/waouh-commerce-action/**"
      - "supabase/functions/waouh-match-history/**"
      - "supabase/functions/waouh-negotiation-router/**"
      - "supabase/functions/waouh-deal-ops/**"
      - "supabase/functions/waouh-buyer-interest/**"
      - "supabase/functions/waouh-buy-handler/**"
      - "supabase/functions/waouh-payment/**"
      - "supabase/functions/waouh-deal-dispatch/**"
      - "supabase/functions/waouh-notify-dispatch/**"
      - "supabase/functions/waouh-webhook/**"
      - "supabase/functions/waouh-channel-in/**"
      - ".github/workflows/deploy-waouh-chat-v2.yml"
      - ".github/workflows/deploy-waouh-native-messaging.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply WAOUH database migrations explicitly"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Same lock as Native Messaging. Whichever starts first applies migrations;
# the second sees an already-migrated database. No concurrent db push.
concurrency:
  group: supabase-production-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: "2.117.0"

jobs:
  deploy:
    name: Deploy canonical WAOUH Chat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout integrated prod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify WAOUH release alignment
        run: python3 scripts/verify-waouh-release.py

      - name: Detect Supabase deployment scope
        id: deploy_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          NEEDS_SUPABASE=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NEEDS_SUPABASE=true
          elif [ "$EVENT_NAME" = "push" ]; then
            BEFORE="${EVENT_BEFORE:-}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              NEEDS_SUPABASE=true
            elif git diff --name-only "$BEFORE" "$GITHUB_SHA" --               .github/workflows/deploy-waouh-chat-v2.yml               supabase/config.toml               supabase/functions               supabase/migrations/20260927120000_waouh_chat_messages_thread_base.sql               supabase/migrations/20260927120500_waouh_chat_messages_thread_backfill.sql               supabase/migrations/20260927121000_waouh_chat_reconcile.sql               supabase/migrations/20260928092242_waouh_chat_v3_flags.sql               supabase/migrations/20260928092245_waouh_commerce_actions.sql               supabase/migrations/20260929140000_waouh_presence_pin_attempts.sql               supabase/migrations/20260929150000_waouh_nexus_followup_cron.sql               supabase/migrations/20260929160000_waouh_avatar_prefs.sql               supabase/migrations/20261004223000_waouh_opportunity_os.sql               supabase/migrations/20261004224000_waouh_opportunity_worker_cron.sql               supabase/migrations/20261008201900_waouh_standalone_journey_threads.sql               | grep -q .; then
              NEEDS_SUPABASE=true
            fi
          fi

          echo "needs_supabase=$NEEDS_SUPABASE" >> "$GITHUB_OUTPUT"
          echo "Supabase deployment required: $NEEDS_SUPABASE"

      - name: No Supabase deployment required
        if: steps.deploy_scope.outputs.needs_supabase != 'true'
        run: |
          echo "✅ No Supabase runtime, deployment workflow or migration changed."
          echo "✅ Skipping PAT validation and deployment safely."

      - name: Setup Supabase CLI
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Resolve and validate production credentials
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            SUPABASE_PROJECT_REF=$(python - <<'PY'
          import tomllib
          with open('supabase/config.toml', 'rb') as fh:
              print(tomllib.load(fh).get('project_id', ''))
          PY
            )
            echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF" >> "$GITHUB_ENV"
          fi
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::SUPABASE_ACCESS_TOKEN absent"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "::error::SUPABASE_DB_PASSWORD absent"; exit 1; }
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "::error::SUPABASE_PROJECT_REF absent"; exit 1; }

      - name: Validate Supabase Management API token
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"             --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             --output /tmp/supabase-project.json             --write-out "%{http_code}" || true)
          if [ "$http_code" != "200" ]; then
            echo "::error::Le SUPABASE_ACCESS_TOKEN de l'environnement GitHub production n'autorise pas le Management API (HTTP $http_code)."
            echo "::error::Créez/rottez un Personal Access Token Supabase scoped sur le projet $SUPABASE_PROJECT_REF avec Edge Functions Read-Write, puis remplacez le secret GitHub production SUPABASE_ACCESS_TOKEN."
            cat /tmp/supabase-project.json 2>/dev/null | head -c 500 || true
            exit 1
          fi
          echo "✅ PAT Supabase valide pour le projet de production."

      - name: Detect WAOUH migration changes
        id: migration_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_APPLY_MIGRATIONS: ${{ inputs.apply_migrations || false }}
        run: |
          set -euo pipefail
          APPLY=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MANUAL_APPLY_MIGRATIONS" = "true" ]; then
              APPLY=true
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            BEFORE="${EVENT_BEFORE:-}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              if git diff --name-only "$BEFORE" "$GITHUB_SHA" --                 supabase/migrations/20260927120000_waouh_chat_messages_thread_base.sql                 supabase/migrations/20260927120500_waouh_chat_messages_thread_backfill.sql                 supabase/migrations/20260927121000_waouh_chat_reconcile.sql                 supabase/migrations/20260928092242_waouh_chat_v3_flags.sql                 supabase/migrations/20260928092245_waouh_commerce_actions.sql                 supabase/migrations/20260929140000_waouh_presence_pin_attempts.sql                 supabase/migrations/20260929150000_waouh_nexus_followup_cron.sql                 supabase/migrations/20260929160000_waouh_avatar_prefs.sql                 | grep -q .; then
                APPLY=true
              fi
            fi
          fi

          echo "apply_migrations=$APPLY" >> "$GITHUB_OUTPUT"
          echo "WAOUH migration push requested: $APPLY"
          if git diff --name-only "${EVENT_BEFORE:-HEAD^}" "$GITHUB_SHA" 2>/dev/null | grep -Eq '20261004223000_waouh_opportunity_os.sql|20261004224000_waouh_opportunity_worker_cron.sql'; then
            echo "ℹ️ Opportunity OS migrations detected."
            echo "ℹ️ They are intentionally excluded from generic db push because production has known historical migration drift."
            echo "ℹ️ Release runbook: apply only these validated additive SQL files through the controlled Supabase release step before merging/deploying."
          fi

      - name: Link Bot.Bj production for database migrations
        if: steps.migration_gate.outputs.apply_migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Skip database push when migrations are unchanged
        if: steps.migration_gate.outputs.apply_migrations != 'true'
        run: |
          echo "ℹ️ No legacy auto-push WAOUH migration changed in this deployment."
          echo "ℹ️ Opportunity OS additive migrations use the controlled release step and are not sent through generic db push."
          echo "ℹ️ Skipping db push so unrelated historical migration drift cannot block Edge Function deployment."

      - name: Preview additive Chat v2 migrations
        if: steps.migration_gate.outputs.apply_migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply pending migrations
        if: steps.migration_gate.outputs.apply_migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The 27/09 backfill migration only INSTALLS the batch function.
          # It never mutates historical messages automatically.
          # If migration history is out of sync, this step must fail rather
          # than repairing production history automatically.
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Apply controlled standalone journey thread migration
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Apply this exact, reviewed migration before publishing dependent Edge code.
          # Do not push unrelated migrations or repair historical migration records.
          python - <<'PY_MIGRATION' > /tmp/standalone-journey-migration.json
          import json
          from pathlib import Path
          statements = []
          for version, name in [('20261008201900','waouh_standalone_journey_threads'),('20261008213000','waouh_external_exchange')]:
              sql = Path(f'supabase/migrations/{version}_{name}.sql').read_text()
              escaped = sql.replace("'", "''")
              record = f"insert into supabase_migrations.schema_migrations(version,name,statements) values ('{version}','{name}',array['{escaped}']) on conflict(version) do nothing;"
              statements.extend([sql,record])
          print(json.dumps({'query': 'begin;\n' + '\n'.join(statements) + '\ncommit;'}))
          PY_MIGRATION
          curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary @/tmp/standalone-journey-migration.json \
            --output /tmp/standalone-journey-migration-result.json
          echo "✅ Standalone journeys retain one unbound discovery and separate canonical discussions."

      - name: Prepare minimal Edge deployment config
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp supabase/config.toml /tmp/waouh-config.original.toml
          cat > supabase/config.toml <<EOF
          project_id = "$SUPABASE_PROJECT_REF"

          [api]
          enabled = true
          port = 54321

          [edge_runtime]
          enabled = true
          policy = "per_worker"
          EOF
          echo "✅ Minimal Supabase Edge config prepared for CI deployment."

      - name: Verify Opportunity OS schema readiness
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The project has historical migration drift; do NOT run a generic
          # db push here. Opportunity OS migrations are applied separately by
          # the controlled release step. This preflight prevents publishing
          # Edge code against a partial schema.
          python - <<'PY' >/tmp/opportunity-os-schema-query.json
          import json
          query = """
          select
            to_regclass('public.waouh_avatar_mandates') is not null as avatar_mandates,
            to_regclass('public.waouh_persistent_intents') is not null as persistent_intents,
            to_regclass('public.waouh_contact_packs') is not null as contact_packs,
            to_regclass('public.waouh_conversation_bus_events') is not null as conversation_bus,
            to_regprocedure('public.waouh_append_conversation_bus_event(uuid,text,text,text,text,uuid,uuid,uuid,uuid,uuid,uuid,text,jsonb)') is not null as conversation_bus_rpc,
            to_regprocedure('public.waouh_sync_opportunity_from_negotiation()') is not null as negotiation_sync_rpc,
            to_regprocedure('public.waouh_sync_opportunity_from_deal()') is not null as deal_sync_rpc,
            exists(
              select 1 from pg_trigger
              where tgname='waouh_opportunity_sync_negotiation' and not tgisinternal
            ) as negotiation_sync_trigger,
            exists(
              select 1 from pg_trigger
              where tgname='waouh_opportunity_sync_deal' and not tgisinternal
            ) as deal_sync_trigger,
            exists(
              select 1 from cron.job
              where jobname='waouh-opportunity-worker-10m'
                and active
                and (command like '%/waouh-opportunity-worker%'
                or command like '%/waouh-e2e-v3-relay%')
            ) as opportunity_worker_cron
          """
          print(json.dumps({"query": query}))
          PY

          http_code=$(curl --silent --show-error \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/opportunity-os-schema-query.json \
            --output /tmp/opportunity-os-schema-result.json \
            --write-out "%{http_code}" || true)

          if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
            echo "::warning::Management API schema preflight unavailable (HTTP $http_code)."
            echo "::warning::Skipping this advisory preflight; controlled migrations and runtime deployment remain authoritative."
            exit 0
          fi

          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "::error::Opportunity OS schema preflight failed with HTTP $http_code"
            cat /tmp/opportunity-os-schema-result.json || true
            exit 1
          fi

          python - <<'PY'
          import json, sys
          with open("/tmp/opportunity-os-schema-result.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          rows = payload if isinstance(payload, list) else payload.get("result", payload.get("data", []))
          if isinstance(rows, dict):
              rows = [rows]
          row = rows[0] if rows else {}
          required = [
              "avatar_mandates", "persistent_intents", "contact_packs",
              "conversation_bus", "conversation_bus_rpc",
              "negotiation_sync_rpc", "deal_sync_rpc",
              "negotiation_sync_trigger", "deal_sync_trigger",
              "opportunity_worker_cron",
          ]
          missing = [name for name in required if row.get(name) is not True]
          if missing:
              print("::error::Opportunity OS schema absent/incomplet: " + ", ".join(missing))
              print("::error::Apply controlled migrations 20261004223000 and 20261004224000 before Edge deployment.")
              sys.exit(1)
          print("✅ Opportunity OS production schema is ready.")
          PY

      - name: Deploy existing WAOUH Chat functions
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            waouh-match-history
            waouh-negotiation-router
            waouh-deal-ops
            waouh-buyer-interest
            waouh-buy-handler
            waouh-payment
            waouh-deal-dispatch
            waouh-notify-dispatch
            waouh-webhook
            waha-webhook
            waouh-channel-in
            waouh-status-publish
            waouh-sell-handler
            waouh-negotiate-handler
            waouh-presence-public-page
            waouh-stock-ingest
            waouh-nexus-followup
            waouh-avatar-briefing
            waouh-outbound-dispatch
            waouh-notify-buyers
            waouh-geocode
            waouh-radar-apify
            waouh-radar-site-scraper
            waouh-radar-process
            waouh-serpapi-scout
            waouh-radar-campaign-tick
            waouh-alerts-check
            waouh-price-compare
            waouh-radar-wa-webhook
            waouh-stock-analyze
            waouh-bi-query
            waouh-agent-insights
            waouh-waha-sync-contacts
          )
          for fn in "${functions[@]}"; do
            echo "🚀 Deploying $fn"
            supabase functions deploy "$fn"               --project-ref "$SUPABASE_PROJECT_REF"               --use-api               --no-verify-jwt
          done
          echo "✅ Existing WAOUH Chat function slots updated."

      - name: Deploy WAOUH admin backend
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "🔐 Deploying waouh-admin-stats (JWT verified)..."
          supabase functions deploy waouh-admin-stats \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api
          echo "✅ WAOUH admin backend deployed with JWT verification."

      - name: Deploy admin E2E runner in dormant production slot
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The canonical waouh-e2e-test slug is reserved by Native Messaging
          # while the project is at the Edge Function quota. Reuse the dormant
          # setup-test-accounts slot for the admin-only E2E runner.
          rm -rf supabase/functions/setup-test-accounts
          cp -R supabase/functions/waouh-e2e-test supabase/functions/setup-test-accounts
          supabase functions deploy setup-test-accounts \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api
          echo "✅ Admin E2E runner deployed in setup-test-accounts (verify_jwt=true)."

      - name: Deploy Opportunity OS in existing production slots
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Production is at the Edge Function quota. Do not create new slugs.
          # Agentic Core already runs under waouh-studio-e2e-v21465.
          # Opportunity Worker reuses waouh-e2e-v3-relay, a documented disabled 410 stub.
          aliases=(
            "waouh-studio-e2e-v21465|waouh-agentic-core|false"
            "waouh-e2e-v3-relay|waouh-opportunity-worker|false"
          )
          for mapping in "${aliases[@]}"; do
            IFS='|' read -r alias source verify_jwt <<< "$mapping"
            test -f "supabase/functions/$source/index.ts" || {
              echo "::error::Source manquante pour $alias : $source"
              exit 1
            }
            rm -rf "supabase/functions/$alias"
            mkdir -p "supabase/functions/$alias"
            cp "supabase/functions/$source/index.ts" "supabase/functions/$alias/index.ts"

            deploy_args=(
              functions deploy "$alias"
              --project-ref "$SUPABASE_PROJECT_REF"
              --use-api
            )
            if [ "$verify_jwt" = "false" ]; then
              deploy_args+=(--no-verify-jwt)
            fi
            echo "🚀 $alias <= $source (verify_jwt=$verify_jwt)"
            supabase "${deploy_args[@]}"
          done
          echo "✅ Opportunity OS deployed without creating Edge Function slots."

      - name: Deploy WAOUH Chat v3 commerce action
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Parcours v3 (Lot 2) : déploie le point d'entrée canonique.
          # Ce workflow ne modifie aucun feature flag ; l'état des flags reste
          # celui contrôlé depuis l'administration / la base de production.
          supabase functions deploy waouh-commerce-action \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api \
            --no-verify-jwt
          echo "✅ waouh-commerce-action deployed; feature flags unchanged."

      - name: Verify public NEXUS search and private action protection
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import json, os, urllib.request, urllib.error
          project = os.environ["SUPABASE_PROJECT_REF"]
          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project}/api-keys",
              headers={"Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"]})
          with urllib.request.urlopen(request, timeout=30) as response:
              keys = json.load(response)
          anon = next(row["api_key"] for row in keys if row.get("name") == "anon")
          def invoke(action, payload):
              request = urllib.request.Request(
                  f"https://{project}.supabase.co/functions/v1/waouh-studio-e2e-v21465",
                  data=json.dumps({"action": action, "payload": payload}).encode(),
                  headers={"Content-Type": "application/json", "apikey": anon, "Authorization": "Bearer " + anon})
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None
          status, body = invoke("nexus.global_discovery", {"query": "ventilateur", "mode": "find_sellers", "refresh_external": False, "smart": False, "limit": 3})
          assert status == 200 and body.get("ok"), f"Public discovery failed (HTTP {status})"
          assert body["data"]["public_read"] is True
          for row in body["data"]["results"]:
              assert not any(key in row for key in ["raw_text", "evidence", "contact_pack", "actor_id"])
              assert row["contact_policy"]["can_reveal"] is False
          status, body = invoke("nexus.sources", {})
          assert status == 200 and body.get("ok"), f"Public source overview failed (HTTP {status})"
          assert body["data"]["providers"] == []
          for action in ["mission.list", "nexus.contact.send"]:
              status, _ = invoke(action, {})
              assert status == 401, f"Private action {action} is not protected (HTTP {status})"
          status, _ = invoke("nexus.guest.read", {"token": "0" * 64})
          assert status == 404, f"Invalid guest capability must be denied (HTTP {status})"
          status, _ = invoke("nexus.external.read", {})
          assert status == 401, f"External owner exchange must require authentication (HTTP {status})"
          print("NEXUS production checks passed: anonymous discovery and sources; private missions and contacts denied.")
          PYVERIFY

      - name: Verify the complete guest exchange in production
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        run: python3 scripts/verify-external-exchange-production.py

      - name: Safety reminder
        if: steps.deploy_scope.outputs.needs_supabase == 'true'
        run: |
          echo "Feature flags are NOT changed by this workflow."
          echo "Historical backfill is NOT executed by this workflow."
          echo "Database migration history is never auto-repaired in production."
          echo "The CI-only minimal Edge config does not modify the repository config.toml."
