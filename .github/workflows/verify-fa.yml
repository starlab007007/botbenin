name: Verify FA IA Production

on:
  workflow_run:
    workflows:
      - Deploy React App botbj
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-fa-production
  cancel-in-progress: true

jobs:
  verify-fa:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0

      - name: Attendre la propagation de production
        run: sleep 20

      - name: Vérifier les URL canoniques FA IA
        run: |
          set -euo pipefail
          for source in 'https://bot.bj/fa/' 'https://bot.bj/fa/index.html' 'https://bot.bj/fa?v=controle'
          do
            curl --silent --show-error --head "$source" \
              | tr -d '\r' \
              | grep -qi '^location: https://bot.bj/fa$'
          done

      - name: Télécharger la version publique
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://bot.bj/fa -o /tmp/fa.html
          grep -q 'FA IA' /tmp/fa.html
          grep -q '<base href="/fa/"' /tmp/fa.html
          grep -q 'flutter-fidelity-v10' /tmp/fa.html

          for file in app.js auth-bridge.js visual-fidelity.js styles.css source-fidelity.css assets-final.js assets-open-0.js assets-closed-0.js fa-real-assets.js manifest.webmanifest
          do
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 4 --retry-all-errors \
              "https://bot.bj/fa/${file}?v=20260723-flutter-fidelity-v10" \
              -o "/tmp/${file//\//_}"
          done

      - name: Vérifier la syntaxe JavaScript
        run: |
          set -euo pipefail
          node --check /tmp/app.js
          node --check /tmp/auth-bridge.js
          node --check /tmp/visual-fidelity.js

      - name: Vérifier le parcours V5.2
        run: |
          set -euo pipefail
          grep -q 'Destinée et orientation' /tmp/app.js
          grep -q 'Projet communautaire' /tmp/app.js
          grep -q 'Comprendre le signe en profondeur' /tmp/app.js
          grep -q 'Résumé essentiel' /tmp/app.js
          grep -q 'fa_ia_journal_v5_2' /tmp/app.js
          grep -Eq '6500[[:space:]]*\+[[:space:]]*rnd\(3001\)' /tmp/app.js
          grep -q 'data-face-index' /tmp/app.js
          grep -q 'Les huit cauris se mêlent' /tmp/app.js
          grep -q 'FA_FLUTTER_THROW' /tmp/app.js
          grep -q 'play({ duration, finalFaces })' /tmp/app.js
          ! grep -q 'Colonne A' /tmp/app.js
          ! grep -q 'Colonne B' /tmp/app.js

      - name: Vérifier l’animation Flutter
        run: |
          set -euo pipefail
          grep -q 'window.FA_FLUTTER_THROW' /tmp/visual-fidelity.js
          grep -q 'crypto.getRandomValues' /tmp/visual-fidelity.js
          grep -q 'translate3d' /tmp/visual-fidelity.js
          grep -q 'effectiveDuration \* 0.92' /tmp/visual-fidelity.js
          grep -q 'settle78' /tmp/visual-fidelity.js
          grep -q 'settle88' /tmp/visual-fidelity.js
          grep -q 'background:transparent!important' /tmp/source-fidelity.css
          grep -q 'fa-flutter-throw' /tmp/source-fidelity.css

      - name: Vérifier les assets réels
        run: |
          set -euo pipefail
          grep -q 'cowrie_open_real' /tmp/assets-final.js
          grep -q 'cowrie_closed_real' /tmp/assets-final.js
          grep -q 'cowrie_open_real' /tmp/fa-real-assets.js
          grep -q 'cowrie_closed_real' /tmp/fa-real-assets.js

      - name: Tester dix configurations de signes
        run: |
          node <<'JS'
          const crypto = require('crypto');
          const patterns = Array.from({length:16},(_,n)=>Array.from({length:4},(_,bit)=>((n>>(3-bit))&1)?'II':'I'));
          const seen = new Set();
          for (let run=0; run<10; run++) {
            const faces=[...crypto.randomBytes(8)].map(v=>v&1?'OPEN':'CLOSED');
            const symbols=faces.map(v=>v==='OPEN'?'I':'II');
            const left=patterns.findIndex(p=>p.join('|')===symbols.slice(0,4).join('|'));
            const right=patterns.findIndex(p=>p.join('|')===symbols.slice(4).join('|'));
            if (faces.length!==8 || left<0 || right<0) process.exit(1);
            seen.add(faces.join('|'));
          }
          if (seen.size < 2) process.exit(1);
          console.log(`Configurations distinctes : ${seen.size}/10`);
          JS

      - name: Vérifier l'absence de régression AprèsBac IA
        run: |
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 4 --retry-all-errors \
            https://bot.bj/apresbacia -o /tmp/apresbac.html
          grep -qi 'AprèsBac' /tmp/apresbac.html

      - name: Publier le reçu de validation
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .verification
          cat > .verification/fa-production.json <<JSON
          {
            "status": "passed",
            "source_sha": "${SOURCE_SHA}",
            "workflow_run": "${SOURCE_RUN}",
            "validated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "https://bot.bj/fa",
            "version": "flutter-fidelity-v10"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B fa-production-verified
          git add .verification/fa-production.json
          git commit -m "test(fa): production validée ${SOURCE_SHA}"
          git push --force origin HEAD:fa-production-verified

      - name: Résultat
        run: echo '✅ FA IA Flutter V5.2 est disponible et AprèsBac IA reste opérationnel.'
