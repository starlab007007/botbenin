name: Apply WAOUH V19 corrections

on:
  push:
    branches:
      - codex

permissions:
  contents: write

jobs:
  apply-fixes:
    if: "${{ github.event.head_commit.message == 'chore: apply WAOUH V19 corrections' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout codex
        uses: actions/checkout@v4
        with:
          ref: codex
          fetch-depth: 0

      - name: Apply atomic source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          root = Path('.')

          def decoded(value):
              return base64.b64decode(value).decode()

          def write_b64(relative, value):
              path = root / relative
              path.write_text(decoded(value))

          def replace_once(relative, old, new):
              path = root / relative
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'Expected one occurrence in {relative}, found {count}'
                  )
              path.write_text(text.replace(old, new, 1))

          def replace_between(relative, start, end, replacement_b64):
              path = root / relative
              text = path.read_text()
              begin = text.find(start)
              finish = text.find(end, begin + len(start))
              if begin < 0 or finish < 0:
                  raise SystemExit(f'Unable to locate block in {relative}')
              replacement = decoded(replacement_b64)
              path.write_text(text[:begin] + replacement + text[finish:])

          write_b64(
              'flutter_waouh_app/lib/live/live_controller_v2.dart',
              ' ',
          )
          write_b64(
              'flutter_waouh_app/lib/live/live_controller_extensions.dart',
              ' aHJlYWQgfHwgc2FtZVNlYXJjaCB8fCAoc2FtZUFydGljbGUgJiYgc2FtZUNvdW50ZXJwYXJ0KSkgewogICAgICByZXR1cm4gaXRlbTsKICAgIH0KICB9CiAgcmV0dXJuIG51bGw7Cn0K',
          )
          write_b64(
              'flutter_waouh_app/lib/live/live_match_chat_v2.dart',
              '     dzcwMCwKICAgICAgICAgICAgICApLAogICAgICAgICAgICApLAogICAgICAgICAgXSB l  ',
          )

          replace_once(
              'flutter_waouh_app/lib/live/live_app_production.dart',
              "  @override\n  Widget build(BuildContext context) {\n    final focused = path.startsWith('/app/chat/') ||",
              "  @override\n  Widget build(BuildContext context) {\n    final controller = context.watch<LiveWaouhController>();\n    if (path == '/app/chat/waouh' &&\n        controller is LiveWaouhControllerV2) {\n      final immediate = controller.takeImmediateMatch();\n      if (immediate != null) {\n        WidgetsBinding.instance.addPostFrameCallback((_) {\n          if (!context.mounted) return;\n          context.go(\n            '/app/chat/match/${Uri.encodeComponent(immediate.key)}',\n            extra: immediate,\n          );\n        });\n      }\n    }\n    final focused = path.startsWith('/app/chat/') ||",
          )

          inbox = 'flutter_waouh_app/lib/live/live_inbox_production.dart'
          replace_between(
              inbox,
              'class _InboxAppBar extends StatelessWidget implements PreferredSizeWidget {',
              'class _SearchBar extends StatelessWidget {',
              '',
          )
          replace_between(
              inbox,
              'class _SearchBar extends StatelessWidget {',
              'class _InboxTabs extends StatelessWidget {',
              ' ',
          )
          replace_between(
              inbox,
              'class _ProfileAvatar extends StatelessWidget {',
              'class _HeaderIcon extends StatelessWidget {',
              '',
          )
          replace_between(
              inbox,
              'class _HeaderIcon extends StatelessWidget {',
              'class _CountBubble extends StatelessWidget {',
              '',
          )
          replace_between(
              inbox,
              'class _OnlineDot extends StatelessWidget {',
              'class _RemoteImage extends StatelessWidget {',
              '',
          )

          replace_between(
              'flutter_waouh_app/lib/live/live_widgets.dart',
              'class LiveHeader extends StatelessWidget implements PreferredSizeWidget {',
              'class LiveMessageBubble extends StatelessWidget {',
              '  ',
          )
          PY

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and validate Flutter
        working-directory: flutter_waouh_app
        shell: bash
        run: |
          flutter pub get
          dart format             lib/live/live_controller_v2.dart             lib/live/live_controller_extensions.dart             lib/live/live_match_chat_v2.dart             lib/live/live_app_production.dart             lib/live/live_inbox_production.dart             lib/live/live_widgets.dart
          flutter analyze --no-fatal-infos
          flutter test test/live_chat_premium_cards_test.dart

      - name: Commit validated corrections
        shell: bash
        run: |
          rm -f .github/workflows/apply-waouh-v19-corrections.yml
          git config user.name "WAOUH Codex"
          git config user.email "waouh-codex@users.noreply.github.com"
          git add -A
          git commit -m "fix: open match chat instantly and compact green UI"
          git push origin HEAD:codex
