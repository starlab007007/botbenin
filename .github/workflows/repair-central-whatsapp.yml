name: Repair and verify the authorized central WhatsApp
on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - '.github/workflows/repair-central-whatsapp.yml'
      - 'scripts/repair-central-waha-host.py'
permissions:
  contents: read
  actions: read
jobs:
  wait_for_web:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this release's Docker deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/workflows/deploy.yml/runs?head_sha='+os.environ['RELEASE_SHA']
          for attempt in range(60):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as r: runs=json.load(r)['workflow_runs']
              if runs and all(run['status']=='completed' for run in runs): break
              time.sleep(5)
          else: raise SystemExit('Web deployment did not finish; central container unchanged')
          print('::notice::Web Docker deployment finished; central WAHA maintenance can run without image-prune interference.')
          PY
  repair_host:
    needs: wait_for_web
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-botbj-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the reviewed host repair script
        run: |
          python3 - <<'PY'
          import base64,os
          with open(os.environ['GITHUB_ENV'],'a') as target:
              target.write('WAHA_REPAIR_SCRIPT_B64='+base64.b64encode(open('scripts/repair-central-waha-host.py','rb').read()).decode()+'\n')
          PY
      - uses: appleboy/ssh-action@v1.2.2
        id: host_repair
        with:
          capture_stdout: true
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 25m
          envs: WAHA_REPAIR_SCRIPT_B64
          script: |
            python3 - <<'PY'
            import base64,os,subprocess
            try:
                exec(compile(base64.b64decode(os.environ['WAHA_REPAIR_SCRIPT_B64']),'repair-central-waha-host.py','exec'))
            except SystemExit as error:
                if error.code: print('::error title=Central WAHA repair::Script exited before verification.')
            except BaseException as error:
                reason = str(error) if isinstance(error,AssertionError) else type(error).__name__
                if isinstance(error,subprocess.CalledProcessError):
                    stderr = (error.stderr or b'').decode(errors='replace') if isinstance(error.stderr,bytes) else (error.stderr or '')
                    categories = ['unauthorized','pull access denied','denied','manifest unknown','no matching manifest','no space left','permission denied','port is already allocated','Cannot connect to the Docker daemon']
                    reason += ': ' + ', '.join(value for value in categories if value.lower() in stderr.lower())
                    reason += '; command=' + ' '.join(error.cmd[:3]) + '; exit=' + str(error.returncode)
                print('::error title=Central WAHA repair::' + reason)
            PY
      - name: Publish only the safe provider repair result
        if: always()
        env:
          REPAIR_OUTPUT: ${{ steps.host_repair.outputs.stdout }}
        run: |
          python3 - <<'PY'
          import os
          failed=False
          for line in os.environ['REPAIR_OUTPUT'].splitlines():
              if line.startswith('::notice ') or line.startswith('::error '): print(line)
              if line.startswith('::error '): failed=True
          raise SystemExit(1 if failed else 0)
          PY
  verify_avatar:
    if: always()
    needs: repair_host
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: supabase-production-${{ github.ref }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || 'mvynepqulhflxtyymtzs' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '2.117.0'
      - name: Publish the central WhatsApp engine and reliable readiness checks
        run: |
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          import shutil
          Path('supabase/config.toml').write_text('project_id = "'+os.environ['SUPABASE_PROJECT_REF']+'"\n[api]\nenabled = true\nport = 54321\n[edge_runtime]\nenabled = true\npolicy = "per_worker"\n')
          for alias,source in [('waouh-studio-e2e-v21465','waouh-agentic-core'),('waouh-e2e-v3-relay','waouh-opportunity-worker')]:
              path=Path('supabase/functions')/alias;path.mkdir(exist_ok=True)
              shutil.copyfile(Path('supabase/functions')/source/'index.ts',path/'index.ts')
          for name in ['waouh-waha-control','waha-webhook','waouh-channel-in','waouh-webhook','waouh-outbound-dispatch','waouh-negotiation-router','waouh-notify-dispatch','waouh-radar-process','waouh-payment','waouh-studio-e2e-v21465','waouh-e2e-v3-relay']:
              result=subprocess.run(['supabase','functions','deploy',name,'--project-ref',os.environ['SUPABASE_PROJECT_REF'],'--use-api','--no-verify-jwt'],capture_output=True,text=True)
              if result.returncode:
                  detail=(result.stdout+result.stderr)[-2400:].replace(os.environ['SUPABASE_ACCESS_TOKEN'],'[redacted]').replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::error title=Central function '+name+'::'+detail)
                  raise SystemExit(result.returncode)
          PY
      - name: Verify central identity, webhook linkage and injection protection
        run: python3 scripts/verify-waouh-central-whatsapp.py --connect
      - name: Verify agreement and execution through the deployed WhatsApp engine
        run: python3 scripts/verify-external-exchange-production.py --whatsapp
      - name: Verify the requested actual incoming message and outgoing Avatar reply
        run: python3 scripts/verify-requested-whatsapp-test.py --phone '+22991299191' --since '2026-10-08T22:10:00Z' --keyword ventilateur
