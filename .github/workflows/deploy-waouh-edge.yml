name: Deploy WAOUH Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - 'supabase/functions/waouh-history/**'
      - 'supabase/functions/waouh-channel-in-secure/**'
      - 'supabase/functions/_shared/waouh-auth.ts'
      - '.github/workflows/deploy-waouh-edge.yml'

jobs:
  deploy-waouh-edge:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || 'mvynepqulhflxtyymtzs' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.117.0"

      - name: Validate WAOUH Edge sources
        run: |
          set -euo pipefail
          test -f supabase/functions/_shared/waouh-auth.ts
          test -f supabase/functions/waouh-history/index.ts
          test -f supabase/functions/waouh-channel-in-secure/index.ts
          grep -q 'invalid_guest_session' supabase/functions/_shared/waouh-auth.ts
          grep -q 'auth_user_mismatch' supabase/functions/_shared/waouh-auth.ts
          grep -q 'requireSameAuthUser' supabase/functions/waouh-history/index.ts
          grep -q 'waouh-channel-in-secure' supabase/functions/waouh-channel-in-secure/index.ts
          echo '✅ Sources Edge WAOUH sécurisées prêtes'

      - name: Check deployment credentials
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::SUPABASE_ACCESS_TOKEN absent de l'environnement production"; exit 1; }
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "::error::SUPABASE_PROJECT_REF absent"; exit 1; }
          echo "✅ Identifiants de déploiement disponibles"

      - name: Prepare minimal Edge deployment config
        run: |
          set -euo pipefail
          cp supabase/config.toml /tmp/waouh-edge-config.original.toml
          cat > supabase/config.toml <<EOF
          project_id = "$SUPABASE_PROJECT_REF"

          [api]
          enabled = true
          port = 54321

          [edge_runtime]
          enabled = true
          policy = "per_worker"
          EOF
          echo "✅ Configuration Edge minimale compatible CLI 2.117.0"

      - name: Deploy secured WAOUH Edge Functions
        run: |
          set -euo pipefail
          supabase functions deploy waouh-history --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy waouh-channel-in-secure --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          echo '✅ Edge Functions WAOUH déployées'
