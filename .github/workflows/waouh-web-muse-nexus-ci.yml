name: WAOUH Web Muse NEXUS CI

on:
  push:
    branches:
      - feat/waouh-web-flutter-nexus-final
      - prod
    paths:
      - "src/pages/waouh/**"
      - "src/components/waouh/**"
      - "src/lib/waouh/**"
      - "src/App.tsx"
      - "src/app-mobile/screens/ChatListScreen.tsx"
      - "src/app-mobile/screens/WaouhChatScreen.tsx"
      - "src/app-mobile/screens/ChatScreen.tsx"
      - "src/app-mobile/layouts/**"
      - "src/erp/**"
      - "public/sw.js"
      - "scripts/verify-waouh-web-parity.mjs"
      - "scripts/verify-waouh-responsive-browser.mjs"
      - "src/app-mobile/components/ChatRightPane.tsx"
      - "supabase/functions/waouh-agentic-core/**"
      - "supabase/functions/waouh-channel-in/**"
      - "supabase/functions/waouh-webhook/**"
      - "supabase/functions/_shared/waouh-promote.ts"
      - "supabase/functions/_shared/waouh-phone.ts"
      - "supabase/functions/waouh-negotiation-router/**"
      - "supabase/functions/waouh-deal-ops/**"
      - "supabase/functions/waouh-commerce-action/**"
      - "supabase/functions/_shared/waouh-commerce-*.ts"
      - "supabase/functions/_shared/waouh-deal-open*.ts"
      - "supabase/functions/_shared/waouh-interest-fastpath*.ts"
      - "supabase/functions/_shared/waouh-message-catalog*.ts"
      - "supabase/functions/_shared/waouh-free-text.ts"
      - "supabase/functions/_shared/waouh-predictive.ts"
      - "supabase/functions/waouh-outbound-dispatch/**"
      - "supabase/migrations/**"
      - "supabase/functions/_shared/waouh-nexus.ts"
      - "supabase/functions/_shared/waouh-signal-fabric.ts"
      - "supabase/functions/_shared/waouh-opportunity-os*.ts"
      - "supabase/functions/_shared/waouh-channel-router*.ts"
      - "supabase/functions/_shared/waouh-promote*.ts"
      - "supabase/functions/waouh-opportunity-worker/**"
      - ".github/workflows/waouh-web-muse-nexus-ci.yml"
      - ".github/workflows/apply-waouh-opportunity-os-migrations.yml"
  pull_request:
    branches:
      - prod
    paths:
      - "src/pages/waouh/**"
      - "src/components/waouh/**"
      - "src/lib/waouh/**"
      - "src/App.tsx"
      - "src/app-mobile/screens/ChatListScreen.tsx"
      - "src/app-mobile/screens/WaouhChatScreen.tsx"
      - "src/app-mobile/screens/ChatScreen.tsx"
      - "src/app-mobile/layouts/**"
      - "src/erp/**"
      - "public/sw.js"
      - "scripts/verify-waouh-web-parity.mjs"
      - "scripts/verify-waouh-responsive-browser.mjs"
      - "src/app-mobile/components/ChatRightPane.tsx"
      - "supabase/functions/waouh-agentic-core/**"
      - "supabase/functions/waouh-channel-in/**"
      - "supabase/functions/waouh-webhook/**"
      - "supabase/functions/_shared/waouh-promote.ts"
      - "supabase/functions/_shared/waouh-phone.ts"
      - "supabase/functions/waouh-negotiation-router/**"
      - "supabase/functions/waouh-deal-ops/**"
      - "supabase/functions/waouh-commerce-action/**"
      - "supabase/functions/_shared/waouh-commerce-*.ts"
      - "supabase/functions/_shared/waouh-deal-open*.ts"
      - "supabase/functions/_shared/waouh-interest-fastpath*.ts"
      - "supabase/functions/_shared/waouh-message-catalog*.ts"
      - "supabase/functions/_shared/waouh-free-text.ts"
      - "supabase/functions/_shared/waouh-predictive.ts"
      - "supabase/functions/waouh-outbound-dispatch/**"
      - "supabase/migrations/**"
      - "supabase/functions/_shared/waouh-nexus.ts"
      - "supabase/functions/_shared/waouh-signal-fabric.ts"
      - "supabase/functions/_shared/waouh-opportunity-os*.ts"
      - "supabase/functions/_shared/waouh-channel-router*.ts"
      - "supabase/functions/waouh-opportunity-worker/**"
  workflow_dispatch:

concurrency:
  group: waouh-web-muse-nexus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-web-and-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web
        run: npm run build

      - name: Verify Flutter/Web route and navigation parity
        run: node scripts/verify-waouh-web-parity.mjs

      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check NEXUS Edge Function
        run: deno check supabase/functions/waouh-agentic-core/index.ts

      - name: Check Opportunity OS worker
        run: deno check supabase/functions/waouh-opportunity-worker/index.ts

      - name: Check WAOUH webhook
        run: deno check supabase/functions/waouh-webhook/index.ts

      - name: Validate Opportunity OS SQL
        run: |
          python -m pip install --quiet "pglast==7.7"
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = [
              Path("supabase/migrations/20261004223000_waouh_opportunity_os.sql"),
              Path("supabase/migrations/20261004224000_waouh_opportunity_worker_cron.sql"),
          ]
          for path in files:
              tree = parse_sql(path.read_text())
              print(f"{path.name}: {len(tree)} instruction(s) SQL valides")
          PY

      - name: Opportunity OS contract tests
        run: deno test supabase/functions/_shared/waouh-opportunity-os-test.ts

      - name: Channel Router contract tests
        run: deno test supabase/functions/_shared/waouh-channel-router-test.ts

      - name: Check WAOUH Chat Channel
        run: deno check supabase/functions/waouh-channel-in/index.ts

      - name: Check WAOUH Chat Orchestrator
        run: deno check supabase/functions/waouh-webhook/index.ts

      - name: Check WAOUH Buy Handler
        run: deno check supabase/functions/waouh-buy-handler/index.ts

      - name: Check WAOUH Negotiation Router
        run: deno check supabase/functions/waouh-negotiation-router/index.ts

      - name: Check WAOUH Deal Operations
        run: deno check supabase/functions/waouh-deal-ops/index.ts

      - name: Check WAOUH Payment
        run: deno check supabase/functions/waouh-payment/index.ts

      - name: Check WAOUH Commerce Action
        run: deno check supabase/functions/waouh-commerce-action/index.ts

      - name: Check WAOUH Channel In (recherche unifiée)
        run: deno check supabase/functions/waouh-channel-in/index.ts

      - name: Check WAOUH Avatar Briefing et suivi Nexus
        run: |
          deno check supabase/functions/waouh-avatar-briefing/index.ts
          deno check supabase/functions/waouh-nexus-followup/index.ts

      - name: Check WAOUH Buyer Interest
        run: deno check supabase/functions/waouh-buyer-interest/index.ts

      - name: Check WAOUH Notify Dispatch
        run: deno check supabase/functions/waouh-notify-dispatch/index.ts

      - name: WAOUH Chat V3 contract tests
        run: |
          deno test supabase/functions/_shared/waouh-commands-test.ts
          deno test supabase/functions/_shared/waouh-negotiation-intent-test.ts
          deno test supabase/functions/_shared/waouh-deal-open-test.ts
          deno test supabase/functions/_shared/waouh-promote-test.ts
          deno test supabase/functions/_shared/waouh-interest-fastpath-test.ts
          deno test supabase/functions/_shared/waouh-message-catalog-test.ts
          deno test supabase/functions/_shared/waouh-commerce-v3-test.ts
          deno test supabase/functions/_shared/waouh-commerce-states-test.ts
          deno test supabase/functions/_shared/waouh-dedupe-test.ts
          deno test supabase/functions/_shared/waouh-notif-thread-test.ts
          deno test supabase/functions/_shared/waouh-identity-paging-test.ts
          deno test supabase/functions/_shared/waouh-partner-seller-test.ts
          deno test supabase/functions/_shared/waouh-unified-quality-test.ts
          deno test supabase/functions/_shared/waouh-internal-call-test.ts
          deno test supabase/functions/_shared/waouh-avatar-briefing-test.ts
          deno test supabase/functions/_shared/waouh-avatar-briefing-core-test.ts
          npm exec --yes --package=vitest@2.1.9 --package=jsdom@25.0.1 -- vitest run src/lib/waouh/__tests__/commerceAction.test.ts src/components/waouh/__tests__/waouh-chat-sync-flow.lock.test.ts

      - name: Check WAOUH Outbound Dispatcher
        run: deno check supabase/functions/waouh-outbound-dispatch/index.ts

      - name: Responsive browser smoke — desktop tablet mobile
        timeout-minutes: 12
        run: node scripts/verify-waouh-responsive-browser.mjs
