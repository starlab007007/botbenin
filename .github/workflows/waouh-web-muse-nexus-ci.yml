name: WAOUH Web Muse NEXUS CI

on:
  push:
    branches:
      - feat/waouh-web-flutter-nexus-final
      - feat/waouh-avatar-deal-graph-e2e
      - prod
    paths:
      - "src/pages/waouh/**"
      - "src/components/waouh/**"
      - "src/components/admin/WaouhAdminCommandCenter.tsx"
      - "src/lib/waouh/**"
      - "src/App.tsx"
      - "src/app-mobile/screens/ChatListScreen.tsx"
      - "src/app-mobile/screens/WaouhChatScreen.tsx"
      - "src/app-mobile/screens/ChatScreen.tsx"
      - "src/app-mobile/components/ChatRightPane.tsx"
      - "supabase/functions/waouh-agentic-core/**"
      - "supabase/functions/waouh-admin-stats/**"
      - "supabase/functions/waouh-radar-api-config/**"
      - "supabase/functions/waouh-radar-apify/**"
      - "supabase/functions/waouh-radar-site-scraper/**"
      - "supabase/functions/waouh-radar-process/**"
      - "supabase/functions/waouh-serpapi-scout/**"
      - "supabase/functions/waouh-radar-wa-webhook/**"
      - "supabase/functions/_shared/radar-api-config.ts"
      - "supabase/functions/_shared/waouhContact.ts"
      - "supabase/functions/_shared/waouh-tel/phone.ts"
      - "supabase/functions/waouh-channel-in/**"
      - "supabase/functions/waouh-negotiation-router/**"
      - "supabase/functions/waouh-deal-ops/**"
      - "supabase/functions/waouh-outbound-dispatch/**"
      - "supabase/functions/waouh-replay-notification/**"
      - "supabase/migrations/**"
      - "supabase/functions/_shared/waouh-nexus.ts"
      - "supabase/functions/_shared/waouh-signal-fabric.ts"
      - "supabase/functions/_shared/waouh-admin-control.ts"
      - "supabase/functions/_shared/waouh-admin-control.ts"
      - ".github/workflows/waouh-web-muse-nexus-ci.yml"
  pull_request:
    branches:
      - prod
    paths:
      - "src/pages/waouh/**"
      - "src/components/waouh/**"
      - "src/components/admin/WaouhAdminCommandCenter.tsx"
      - "src/lib/waouh/**"
      - "src/App.tsx"
      - "src/app-mobile/screens/ChatListScreen.tsx"
      - "src/app-mobile/screens/WaouhChatScreen.tsx"
      - "src/app-mobile/screens/ChatScreen.tsx"
      - "src/app-mobile/components/ChatRightPane.tsx"
      - "supabase/functions/waouh-agentic-core/**"
      - "supabase/functions/waouh-admin-stats/**"
      - "supabase/functions/waouh-radar-api-config/**"
      - "supabase/functions/waouh-radar-apify/**"
      - "supabase/functions/waouh-radar-site-scraper/**"
      - "supabase/functions/waouh-radar-process/**"
      - "supabase/functions/waouh-serpapi-scout/**"
      - "supabase/functions/waouh-radar-wa-webhook/**"
      - "supabase/functions/_shared/radar-api-config.ts"
      - "supabase/functions/_shared/waouhContact.ts"
      - "supabase/functions/_shared/waouh-tel/phone.ts"
      - "supabase/functions/waouh-channel-in/**"
      - "supabase/functions/waouh-negotiation-router/**"
      - "supabase/functions/waouh-deal-ops/**"
      - "supabase/functions/waouh-outbound-dispatch/**"
      - "supabase/functions/waouh-replay-notification/**"
      - "supabase/migrations/**"
      - "supabase/functions/_shared/waouh-nexus.ts"
      - "supabase/functions/_shared/waouh-signal-fabric.ts"
  workflow_dispatch:

concurrency:
  group: waouh-web-muse-nexus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-web-and-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web
        run: npm run build

      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check NEXUS Edge Function
        run: deno check supabase/functions/waouh-agentic-core/index.ts

      - name: Check WAOUH Admin Command Center
        run: deno check supabase/functions/waouh-admin-stats/index.ts

      - name: Check NEXUS Admin Connectors
        run: |
          deno check supabase/functions/waouh-radar-api-config/index.ts
          deno check supabase/functions/waouh-radar-apify/index.ts
          deno check supabase/functions/waouh-radar-site-scraper/index.ts
          deno check supabase/functions/waouh-radar-wa-webhook/index.ts
          deno check supabase/functions/waouh-radar-process/index.ts
          deno check supabase/functions/waouh-serpapi-scout/index.ts

      - name: Check WAOUH Chat Channel
        run: deno check supabase/functions/waouh-channel-in/index.ts

      - name: Check WAOUH Negotiation Router
        run: deno check supabase/functions/waouh-negotiation-router/index.ts

      - name: Check WAOUH Deal Operations
        run: deno check supabase/functions/waouh-deal-ops/index.ts

      - name: Check WAOUH Outbound Dispatcher
        run: |
          deno check supabase/functions/waouh-outbound-dispatch/index.ts
          deno check supabase/functions/waouh-replay-notification/index.ts
