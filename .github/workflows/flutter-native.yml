name: Flutter native validation

on:
  push:
    paths:
      - 'flutter_waouh_app/**'
      - '.github/workflows/flutter-native.yml'
  pull_request:
    paths:
      - 'flutter_waouh_app/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_waouh_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply current Flutter source compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('lib/main.dart')
          main.write_text(
              main.read_text(encoding='utf-8').replace(
                  'cardTheme: CardTheme(',
                  'cardTheme: CardThemeData(',
                  1,
              ),
              encoding='utf-8',
          )

          whatsapp = Path('lib/live/live_whatsapp_ia_native_screen.dart')
          source = whatsapp.read_text(encoding='utf-8')
          replacement = '''  Future<void> _openActions(LiveWhatsAppSession session) async {
            final action = await showWhatsAppSessionActionsSheet(context, session);
            if (!mounted || action == null) return;

            switch (action) {
              case LiveWhatsAppSessionAction.connect:
                await showWhatsAppConnectionSheet(
                  context,
                  sessionName: session.name,
                  repository: _repository,
                  onConnected: _refresh,
                );
                break;
              case LiveWhatsAppSessionAction.start:
                await _run(
                  () => _repository.start(session.name),
                  success: 'Session démarrée. Préparation du QR en cours.',
                );
                break;
              case LiveWhatsAppSessionAction.stop:
                await _run(
                  () => _repository.stop(session.name),
                  success: 'Session arrêtée.',
                );
                break;
              case LiveWhatsAppSessionAction.test:
                await showWhatsAppTestMessageSheet(
                  context,
                  sessionName: session.name,
                );
                break;
              case LiveWhatsAppSessionAction.linkBot:
                await showWhatsAppBotLinkSheet(
                  context,
                  sessionName: session.name,
                );
                break;
              case LiveWhatsAppSessionAction.webhook:
                await showWhatsAppWebhookSheet(
                  context,
                  sessionName: session.name,
                );
                break;
              case LiveWhatsAppSessionAction.delete:
                await _confirmDelete(session);
                break;
            }
          }

          Future<void> _run'''
          pattern = r"  Future<void> _openActions\(LiveWhatsAppSession session\) async \{.*?\n  \}\n\n  Future<void> _run"
          patched, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('WhatsApp action handler not found; source has not been changed.')
          whatsapp.write_text(patched, encoding='utf-8')
          PY
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
      - name: Compile connected Android debug APK
        run: flutter build apk --debug --target lib/live/live_app.dart
      - uses: actions/upload-artifact@v4
        with:
          name: WaouhApp-debug-ci
          path: flutter_waouh_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
