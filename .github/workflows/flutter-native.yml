name: Flutter native validation

on:
  push:
    paths:
      - 'flutter_waouh_app/**'
      - '.github/workflows/flutter-native.yml'
  pull_request:
    paths:
      - 'flutter_waouh_app/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_waouh_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build verified Waouh ARM64 APK
        run: bash scripts/build_arm64_test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WaouhApp-arm64-test
          path: flutter_waouh_app/release-apks/WaouhApp-arm64-test.apk
          if-no-files-found: error
