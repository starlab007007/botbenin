name: Diagnose Avatar discovery (read only)
on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths: ['.github/workflows/diagnose-avatar-discovery.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publish trusted provider history diagnostics
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || 'mvynepqulhflxtyymtzs' }}
        run: supabase functions deploy waouh-waha-control --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
      - name: Inspect central WhatsApp session and identity without sending messages
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || 'mvynepqulhflxtyymtzs' }}
        run: python3 scripts/verify-waouh-central-whatsapp.py
      - name: Inspect deployed search configuration and schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || 'mvynepqulhflxtyymtzs' }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          ref = os.environ['SUPABASE_PROJECT_REF']
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          def request(path, body=None):
              req = urllib.request.Request('https://api.supabase.com/v1/projects/' + ref + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  print('::error::Diagnostic API HTTP ' + str(e.code))
                  raise SystemExit(1)
          f = request('/functions/waouh-studio-e2e-v21465')
          for name in ['waouh-webhook','waha-webhook','waouh-channel-in','waouh-waha-control','waouh-outbound-dispatch']:
              detail = request('/functions/' + name)
              print('::notice title=Published ' + name + '::version=' + str(detail.get('version')) + '; updated_at=' + str(detail.get('updated_at')) + '; verify_jwt=' + str(detail.get('verify_jwt')))
          trace = request('/database/query', {'query': "select direction,count(*) as count,max(created_at) as latest_at from public.waouh_messages where channel='whatsapp' and phone_number in ('22991299191','+22991299191','2290191299191','+2290191299191') and created_at>='2026-10-08T22:10:00Z' group by direction"})
          print('::notice title=Requested WhatsApp test trace::' + json.dumps(trace))
          controls = request('/database/query', {'query': "select module_key,enabled,automation_enabled from public.waouh_admin_module_controls where module_key in ('chat_whatsapp','avatar_commerce')"})
          print('::notice title=WhatsApp module controls::' + json.dumps(controls))
          print('::notice::Agentic runtime verify_jwt=' + str(f.get('verify_jwt')))
          with urllib.request.urlopen('https://' + ref + '.supabase.co/auth/v1/.well-known/jwks.json', timeout=20) as r:
              jwks = json.load(r)
          print('::notice::Auth signing algorithms=' + ','.join(sorted({str(k.get('alg', k.get('kty'))) for k in jwks.get('keys', [])})))
          rows = request('/database/query', {'query': "select to_regclass('public.waouh_signal_fabric') is not null as fabric_exists, to_regclass('public.waouh_contact_packs') is not null as contact_packs_exist, to_regclass('public.waouh_external_commerce_signals') is not null as external_signals_exist"})
          print('::notice::Discovery schema=' + json.dumps(rows))
          request('/database/query', {'query': 'select 1 from public.waouh_signal_fabric limit 1'})
          print('::notice::Discovery view query succeeded')
          PY
      - name: Verify only the explicitly requested real WhatsApp test
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || 'mvynepqulhflxtyymtzs' }}
        run: python3 scripts/verify-requested-whatsapp-test.py --phone '+22991299191' --since '2026-10-08T22:10:00Z' --keyword ventilateur
