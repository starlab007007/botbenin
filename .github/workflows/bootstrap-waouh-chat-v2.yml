name: Bootstrap WAOUH Chat v2 Integration

on:
  push:
    branches:
      - feat/waouh-chat-v2-thread-canonical-20260927
    paths:
      - ".waouh-bootstrap/READY"

permissions:
  contents: write

concurrency:
  group: waouh-chat-v2-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct delivered patch
        shell: bash
        run: |
          set -euo pipefail
          cat .waouh-bootstrap/patch.b64.part-* | base64 -d | gzip -dc > /tmp/waouh-chat-v2.patch
          test -s /tmp/waouh-chat-v2.patch
          git apply --check /tmp/waouh-chat-v2.patch
          echo "Patch reconstructed and validated."

      - name: Apply lot and safety hardening
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/waouh-chat-v2.patch
          python .waouh-bootstrap/harden.py

      - name: Remove bootstrap transport files
        shell: bash
        run: |
          rm -rf .waouh-bootstrap
          rm -f .github/workflows/bootstrap-waouh-chat-v2.yml

      - name: Commit integrated lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zimesongbian007"
          git config user.email "zimesongbian007@gmail.com"
          git add -A
          git status --short
          git commit -m "feat(waouh-chat): canonical thread, single writer and safe reconciliation"
          git push origin HEAD:feat/waouh-chat-v2-thread-canonical-20260927
