name: WAOUH Flutter Muse NEXUS CI

on:
  push:
    branches:
      - feat/waouh-web-flutter-nexus-final
      - feat/waouh-avatar-deal-graph-e2e
      - prod
    paths:
      - "flutter_waouh_app/**"
      - ".github/workflows/waouh-flutter-muse-nexus-ci.yml"
  pull_request:
    branches:
      - prod
    paths:
      - "flutter_waouh_app/**"
      - ".github/workflows/waouh-flutter-muse-nexus-ci.yml"
  workflow_dispatch:

concurrency:
  group: waouh-flutter-muse-nexus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: flutter_waouh_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android 36 and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: NEXUS and agentic tests
        run: |
          flutter test test/live_nexus_service_test.dart
          flutter test test/live_agentic_waouh_test.dart
          flutter test test/live_models_test.dart
          flutter test test/live_commerce_workflow_test.dart
          flutter test test/live_chat_premium_cards_test.dart

      - name: Build optimized arm64 test APK
        env:
          WAOUH_TEST_RELEASE: "1"
        run: |
          flutter build apk             --release             --target lib/live/live_app_production.dart             --target-platform android-arm64             --split-per-abi             --obfuscate             --split-debug-info=build/symbols
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          sha256sum build/app/outputs/flutter-apk/app-arm64-v8a-release.apk             > build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waouh-muse-nexus-arm64-test
          path: |
            flutter_waouh_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter_waouh_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
