name: WAOUH module policy
on:
  pull_request:
    branches: [prod]
    paths: ['src/hooks/useFrontendModules.tsx','src/components/waouh/WaouhModuleAccessGate.tsx','supabase/functions/_shared/waouh-module*','supabase/migrations/*module*','scripts/tests/waouh-module-policy-db.mjs','.github/workflows/waouh-module-policy.yml']
  push:
    branches: [prod]
    paths: ['src/hooks/useFrontendModules.tsx','src/components/waouh/WaouhModuleAccessGate.tsx','supabase/functions/_shared/waouh-module*','supabase/migrations/*module*','scripts/tests/waouh-module-policy-db.mjs','.github/workflows/waouh-module-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: module-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config supabase/functions/_shared/waouh-module-policy.ts supabase/functions/_shared/waouh-module-request.ts
      - run: python3 scripts/verify-waouh-release.py
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Deploy policy-aware application services
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cat > supabase/config.toml <<'CONFIG'
          project_id = "mvynepqulhflxtyymtzs"
          [edge_runtime]
          enabled = true
          policy = "per_worker"
          CONFIG
          python3 - <<'PY'
          import json,subprocess,shutil
          from pathlib import Path
          for row in json.loads(Path('supabase/functions/_shared/waouh-module-deploy.json').read_text()):
              name,source=row['name'],row['source']
              if name!=source:
                  target=Path('supabase/functions')/name
                  target.mkdir(exist_ok=True)
                  shutil.copyfile(Path('supabase/functions')/source/'index.ts',target/'index.ts')
              cmd=['supabase','functions','deploy',name,'--project-ref','mvynepqulhflxtyymtzs','--use-api']
              if not row['verify_jwt']:cmd.append('--no-verify-jwt')
              subprocess.run(cmd,check=True)
          PY
