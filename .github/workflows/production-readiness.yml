name: WAOUH production readiness
on:
  pull_request:
    branches: [prod]
    paths:
      - 'scripts/verify-production-readiness.py'
      - 'scripts/waouh_readiness_evidence.py'
      - 'scripts/tests/test_waouh_readiness_evidence.py'
      - '.github/workflows/production-readiness.yml'
  workflow_dispatch:
    inputs:
      live_whatsapp:
        description: 'Envoyer le parcours réel aux deux numéros du propriétaire'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: waouh-production-readiness-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/verify-production-readiness.py scripts/waouh_readiness_evidence.py
      - run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p test_waouh_readiness_evidence.py
  readiness:
    needs: evidence-tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || 'mvynepqulhflxtyymtzs' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '2.117.0'
      - name: Deploy the end-to-end test runner
        run: |
          printf 'project_id = "%s"\n[api]\nenabled = true\nport = 54321\n[edge_runtime]\nenabled = true\npolicy = "per_worker"\n' "$SUPABASE_PROJECT_REF" > supabase/config.toml
          python3 - <<'PY'
          import os,subprocess
          r=subprocess.run(['supabase','functions','deploy','waouh-e2e-test','--project-ref',os.environ['SUPABASE_PROJECT_REF'],'--use-api','--no-verify-jwt'],capture_output=True,text=True)
          if r.returncode:
              d=(r.stdout+r.stderr)[-2400:].replace(os.environ['SUPABASE_ACCESS_TOKEN'],'[redacted]').replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Deploy waouh-e2e-test::'+d); raise SystemExit(r.returncode)
          PY
      - name: Production readiness checks
        env:
          LIVE_WHATSAPP: ${{ github.event.inputs.live_whatsapp == 'true' && '1' || '0' }}
        run: python3 scripts/verify-production-readiness.py
