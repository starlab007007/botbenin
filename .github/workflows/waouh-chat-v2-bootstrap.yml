name: WAOUH Chat v2 Bootstrap Integration

on:
  push:
    branches:
      - feat/waouh-chat-v2-thread-canonical-20260927
    paths:
      - ".github/workflows/waouh-chat-v2-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: waouh-chat-v2-bootstrap
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/waouh-chat-v2-thread-canonical-20260927

      - name: Verify baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE="8c909bae9d7ecb948aa9e418f8572c1650a52da6"
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          echo "Baseline OK: $BASE"

      - name: Reconstruct and verify supplied lot
        shell: bash
        run: |
          set -euo pipefail
          cat .waouh-bootstrap/patch.b64.part-* > /tmp/waouh-chat-v2.patch.b64
          echo "55c30bec10eaf452bc25c14b368813e513f44cbf42d84a6611885e56e71d84f7  /tmp/waouh-chat-v2.patch.b64" | sha256sum -c -
          base64 -d /tmp/waouh-chat-v2.patch.b64 | gzip -d > /tmp/waouh-chat-v2.patch
          echo "3ed0c6bd552cc5e48b933f65cbf86c9436714fcaf9b0fc7490722c32e1e16b95  /tmp/waouh-chat-v2.patch" | sha256sum -c -
          git config user.name "zimesongbian007"
          git config user.email "zimesongbian007@gmail.com"
          git am --3way /tmp/waouh-chat-v2.patch

      - name: Apply safe-integration hardening
        run: python3 .waouh-bootstrap/harden.py

      - name: Guardrails
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "v_res := public.waouh_backfill_message_threads(5000, v_cursor)" supabase/migrations/20260927120500_waouh_chat_messages_thread_backfill.sql
          grep -q "waouh_same_person(m.user_id, t.buyer_user_id)" supabase/migrations/20260927120500_waouh_chat_messages_thread_backfill.sql
          ! grep -q "return 0.05" supabase/functions/waouh-chat-reconcile/index.ts
          grep -q "r4_threads_ambiguous_deals" supabase/migrations/20260927121000_waouh_chat_reconcile.sql
          ! grep -q "chat_integrity: chatIntegrity" supabase/functions/waouh-health-check/index.ts
          grep -q "actor_not_unambiguous_party" supabase/functions/waouh-negotiation-router/index.ts
          grep -q "negotiation_actor_invalid" supabase/functions/waouh-webhook/index.ts

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web production build
        run: npm run build

      - name: WAOUH regression tests
        run: npx vitest run

      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Canonical chat unit tests
        shell: bash
        run: |
          set -euo pipefail
          deno test --allow-env --allow-net --allow-read             supabase/functions/_shared/waouh-chat-writer.test.ts             supabase/functions/_shared/waouh-commands.test.ts             supabase/functions/_shared/waouh-commerce-states.test.ts             supabase/functions/_shared/waouh-negotiation-intent.test.ts             supabase/functions/waouh-negotiation-router/aiIntent.test.ts

      - name: Deno checks for modified Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for f in             supabase/functions/waouh-buyer-interest/index.ts             supabase/functions/waouh-channel-in/index.ts             supabase/functions/waouh-chat-reconcile/index.ts             supabase/functions/waouh-deal-ops/index.ts             supabase/functions/waouh-match-history/index.ts             supabase/functions/waouh-negotiation-router/index.ts             supabase/functions/waouh-webhook/index.ts; do
            deno check "$f"
          done

      - name: Collapse bootstrap history into one clean integration commit
        shell: bash
        run: |
          set -euo pipefail
          BASE="8c909bae9d7ecb948aa9e418f8572c1650a52da6"
          rm -rf .waouh-bootstrap
          rm -f .github/workflows/waouh-chat-v2-bootstrap.yml
          git add -A
          git reset --soft "$BASE"
          git add -A
          git commit -m "feat(waouh-chat): canonical thread writer and safe reconciliation"
          git push --force-with-lease origin HEAD:feat/waouh-chat-v2-thread-canonical-20260927
