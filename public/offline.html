<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors ligne — Bot.BJ</title>
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <style>
      *{box-sizing:border-box}
      html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#111b21}
      .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
      img{width:88px;height:88px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.12);margin-bottom:20px}
      h1{font-size:20px;margin:0 0 8px;color:#075E54}
      p{font-size:15px;line-height:1.5;color:#3b4a54;max-width:340px;margin:0 0 22px}
      button{background:#075E54;color:#fff;border:0;padding:12px 22px;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer}
      button:active{transform:scale(.97)}
      .hint{margin-top:18px;font-size:12px;color:#667781}
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icon-192.png" alt="Bot.BJ" />
      <h1>Vous êtes hors ligne</h1>
      <p>Pas d'internet pour le moment. Vos conversations déjà ouvertes restent accessibles. Les nouveaux messages seront envoyés dès que la connexion revient.</p>
      <button onclick="location.reload()">Réessayer</button>
      <div class="hint">Bot.BJ • WAOUH</div>
    </div>
  </body>
</html>
