

services:
  react-app:
    build: .
    container_name: react-app-botjs
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.react-app-bot.rule=Host(`bot.bj`)"
      - "traefik.http.routers.react-app-bot.entrypoints=websecure"

      - "traefik.http.routers.react-app-bot.tls.certresolver=myresolver"
#      - "traefik.http.routers.react-app-bot.tls.certresolver=letsencrypt"
      - "traefik.http.services.react-app-bot.loadbalancer.server.port=80"
      - "traefik.port=80"


    ports:
      - 8084:80
    networks:
      - web


networks:
  web:
    external: true
