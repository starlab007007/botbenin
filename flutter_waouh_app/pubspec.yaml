name: waouh_app_native
description: WaouhApp native Flutter application connected to the existing Bot.BJ Supabase backend.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  go_router: ^14.6.2
  fl_chart: ^0.69.2
  flutter_slidable: ^3.1.2
  image_picker: ^1.1.2
  intl: ^0.20.1
  google_sign_in: ^6.2.2
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
