allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects { subproject ->
    if (subproject.name != "app") {
        subproject.ext.flutter = [
            compileSdkVersion: 36,
            minSdkVersion: 23,
            targetSdkVersion: 36
        ]
    }
}
// file_picker 11.0.x ne déclare pas Kotlin quand le Kotlin intégré d'AGP 9 est
// désactivé : ses classes ne sont alors pas compilées. À retirer lors du
// passage à file_picker 12 ou plus.
subprojects { subproject ->
    if (subproject.name == "file_picker") {
        subproject.pluginManager.withPlugin("com.android.library") {
            subproject.pluginManager.apply("org.jetbrains.kotlin.android")
        }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
