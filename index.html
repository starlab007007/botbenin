
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot.BJ - Assistant IA</title>
    <base href="/" />
    
    <!-- Preconnect pour optimiser le chargement -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Meta tags pour SEO et partage social -->
    <meta name="description" content="Bot.BJ - Assistant IA intelligent pour vos besoins quotidiens" />
    <meta name="author" content="Bot.BJ" />
    <meta name="keywords" content="Bot IA, Assistant intelligent, Bénin, Automatisation" />
    <meta property="og:title" content="Bot.BJ - Assistant IA" />
    <meta property="og:description" content="Assistant IA intelligent pour vos besoins quotidiens" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bot.bj" />
    
    <!-- Optimisations pour le cache et les performances -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Sécurité -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://*.elevenlabs.io https://cdn.gpteng.co; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-src https://*.elevenlabs.io; worker-src 'self'; media-src 'self' data: blob:;">
    
    <!-- Configuration globale ElevenLabs -->
    <script>
      // Configuration du chemin du module AudioWorklet
      window.ELEVEN_CONVAI_WORKLET_PATH = '/raw-audio-processor.js';
    </script>
    
    <!-- PWA et mobile -->
    <meta name="theme-color" content="#3B82F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript requis</h1>
        <p>Cette application nécessite JavaScript pour fonctionner correctement.</p>
        <p>Veuillez activer JavaScript dans votre navigateur et recharger la page.</p>
      </div>
    </noscript>
    <div id="root">
      <!-- Indicateur de chargement -->
      <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-family: Arial, sans-serif;">
        <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3B82F6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
        <p style="color: #666; margin: 0;">Chargement de Bot.BJ...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
